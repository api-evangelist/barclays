note: Barclays publishes no plans, tiers or prices for the API Exchange. There is no pricing page in the portal
  sitemap and a registry search for "pricing" returns no pricing document. The UK Open Banking and Barclays Bank
  Ireland APIs are the regulated PSD2/CMA surface, which an authorised TPP consumes without a Barclays commercial
  agreement; the Barclaycard and corporate APIs are contracted bilaterally after registration and access approval,
  and those terms are not published. REPLACES a 2026-05-04 bulk-sweep scaffold that carried invented Free/Professional/Enterprise
  tiers with fabricated 1,000 and 100,000 request quotas — none of which Barclays publishes.
