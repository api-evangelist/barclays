note: 'Three unrelated auth regimes under one portal. (1) UK Open Banking: OAuth 2.0 client-credentials for TPP-to-ASPSP
  calls and authorization-code with PSU SCA for consented access, over mTLS with an Open Banking-issued transport
  certificate — https://telesto.api.barclays presents a certificate issued by "OpenBanking Issuing CA". (2) Barclays
  Bank Ireland: Berlin Group NextGenPSD2 PSU redirect with Digest/Signature/TPP-Signature-Certificate request signing.
  (3) Barclaycard US: OAuth 2.0 client-credentials against a TIAA-US token service. The tokenUrl values in the published
  specs are placeholders or internal hosts and cannot be used; real endpoints are issued at onboarding. TPP onboarding
  itself is an API — Dynamic Client Registration v1.10, which takes an eIDAS certificate.'
