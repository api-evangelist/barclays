  note: The Barclaycard US APIs and the open-data APIs declare no pagination envelope.
request_id_tracing:
  headers:
  - x-fapi-interaction-id (UK Open Banking)
  - X-Request-ID (Barclays Bank Ireland)
  - Correlation-ID (Barclaycard US)
  echoed_in_response: true
  note: Three different correlation headers for three API families — an agent cannot use one convention across the
    estate.
