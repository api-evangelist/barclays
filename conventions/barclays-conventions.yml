  measured:
    mutating_operations: 64
    operations_with_idempotency_key: 19
    apis_covered: 2
    apis_total: 26
  retention: null
  note: 19 of 64 mutating operations across the estate declare x-idempotency-key, and all 19 sit in the two UK Open
    Banking payment APIs where OBIE mandates the header. The Barclays Bank Ireland payment writes and every Barclaycard
    US write — card applications, card controls, payments, account management — declare no replay protection at
    all. Barclays publishes no key-retention window.
reversibility:
  grade: documented
  note: Every reversal Barclays publishes is a consent revocation, not a transaction reversal. A TPP can DELETE
    a consent and stop future access or future payments; nothing in the 26 published contracts cancels, refunds,
    voids or reverses a payment that has already executed, and no operation declares a window inside which a reversal
    is accepted. Barclaycard US has no reversal operation of any kind. Grade is documented rather than verified
    because no stated window exists.
  reversals:
  - operationId: DeleteAccountAccessConsentsConsentId
    api: Account and Transactions
    method: delete
    path: /account-access-consents/{consentId}
    reverses: account access consent
    window: null
  - operationId: DeleteFundsConfirmationConsentsConsentId
    api: Confirmation of Funds
    method: delete
    path: /funds-confirmation-consents/{consentId}
    reverses: funds confirmation consent
    window: null
  - operationId: domesticVrpConsentsDelete
    api: Variable Recurring Payment
    method: delete
    path: /domestic-vrp-consents/{consentId}
    reverses: VRP consent (stops future sweeps)
    window: null
  - operationId: DeleteEventSubscriptionsEventSubscriptionId
    api: Event Notification
    method: delete
    path: /event-subscriptions/{eventSubscriptionId}
    reverses: event subscription
    window: null
  - operationId: delete_consents__consentId_
    api: Barclays Bank Ireland Account Information
    method: delete
    path: /consents/{consentId}
    reverses: AIS consent
    window: null
  - operationId: delete_payments_sepa-credit-transfers__paymentId_
    api: Barclays Bank Ireland Payment Initiation
    method: delete
    path: /payments/sepa-credit-transfers/{paymentId}
    reverses: a SEPA credit transfer that has not yet executed
    window: null
    note: Berlin Group payment cancellation — the spec states no cut-off, and cancellation of an executed payment
      is not offered.
  irreversible:
  - 'Payment Initiation: all Create*Payments operations once the payment reaches ACSC/ACCC'
  - 'Card Application: application submission'
  - 'Payments (Barclaycard US): all payment operations'
  - 'Benefits Redemption: points redemption'
dry_run_mode:
  supported: false
  note: 'No operation accepts a dry-run/validate-only flag. The nearest rehearsal is the OBIE consent resource:
    a TPP creates a *-consent first and can inspect its status before calling the matching execute operation, and
    Payment Initiation offers GET /{type}-payment-consents/{consentId}/funds-confirmation to check funds before
    executing.'
