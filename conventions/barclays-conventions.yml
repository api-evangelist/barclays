generated: '2026-09-04'
method: derived
source: openapi/ (26 first-party OpenAPI 3.1 documents harvested from developer.barclays.com)
note: 'Barclays runs three distinct API conventions under one portal: UK Open Banking (OBIE Read/Write, x-fapi-*
  headers), Barclays Bank Ireland (Berlin Group NextGenPSD2, PSU-*/TPP-* headers), and Barclaycard US (Correlation-ID
  + bearer token). Nothing about the three is unified, so an agent has to detect which family it is calling before
  it can build a request.'
auth:
  style: OAuth 2.0 bearer token
  families:
  - family: UK Open Banking (BUK)
    schemes:
    - TPPOAuth2Security (client_credentials)
    - PSUOAuth2Security (authorization_code)
    transport_security: mTLS with an Open Banking-issued transport certificate (see conformance/)
    headers:
    - Authorization
    - x-fapi-auth-date
    - x-fapi-customer-ip-address
    - x-fapi-interaction-id
    - x-customer-user-agent
  - family: Barclays Bank Ireland (Berlin Group NextGenPSD2)
    schemes:
    - OAuth 2.0 / PSU redirect (SCA)
    headers:
    - X-Request-ID
    - Consent-ID
    - PSU-ID
    - PSU-ID-Type
    - PSU-IP-Address
    - PSU-Device-ID
    - TPP-Redirect-URI
    - Digest
    - Signature
    - TPP-Signature-Certificate
  - family: Barclaycard US
    schemes:
    - ExternalTiaaUsCCAuth (client_credentials)
    - InternalTiaaUsRopcAuth
    headers:
    - Authorization
    - Correlation-ID
    - Content-Type
    - X-Channel-Id
  see: authentication/barclays-authentication.yml, scopes/barclays-scopes.yml
