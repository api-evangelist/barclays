note: 'The scope names below are the ones Barclays itself publishes per API in its registry, not scopes inferred
  from the specs. The specs are less useful here: the UK Open Banking securitySchemes carry the OBIE placeholder
  tokenUrl https://authserver.example/token, and the Barclaycard US schemes carry an internal host (token.tiaa-dev.us.barclays.intranet:8443)
  that is not reachable from the public internet. Barclays publishes no OpenID discovery document on any host, so
  the real production token and authorization endpoints are not obtainable anonymously — a registered TPP receives
  them on onboarding.'
