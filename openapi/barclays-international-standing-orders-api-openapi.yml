                      UltimateDebtor:
                        SchemeName: UK.OBIE.IBAN
                        Identification: '2360549017905161589'
                        Name: Ultimate Debtor
                        LEI: 8200007YHFDMEODY1965
                        PostalAddress:
                          AddressType: BIZZ
                          StreetName: Bank Street
                          BuildingNumber: '11'
                          Floor: '6'
                          PostCode: Z78 4TY
                          TownName: London
                          Country: UK
                      UltimateCreditor:
                        SchemeName: UK.OBIE.IBAN
                        Identification: '2360549017905161589'
                        Name: Ultimate Creditor
                        LEI: 60450004FECVJV7YN339
                        PostalAddress:
                          AddressType: BIZZ
                          StreetName: Bank Street
                          BuildingNumber: '11'
                          Floor: '6'
                          PostCode: Z78 4TY
                          TownName: London
                          Country: UK
                      RegulatoryReporting:
                      - DebitCreditReportingIndicator: CRED
                        Authority:
                          Name: string
