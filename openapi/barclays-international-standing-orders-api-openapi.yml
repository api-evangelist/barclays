openapi: 3.2.0
info:
  title: Payment Initiation International Standing Orders API
  description: Initiate a single and immediate non-mandated funds transfer
  version: v4.0
tags:
- name: International Standing Orders
  description: International Standing Orders
paths:
  /international-standing-orders:
    summary: Create International Standing Orders
    description: Create International Standing Orders
