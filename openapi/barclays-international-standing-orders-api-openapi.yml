components:
  schemas:
    OBReferredDocumentInformation:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Code:
          $ref: '#/components/schemas/ExternalDocumentType1Code'
        Issuer:
          type: string
          description: Identification of the issuer of the reference document type.
          example: issuer
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,35})$
        Number:
          type: string
          description: Identification of the type specified for the referred document line.
          example: number
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,35})$
        RelatedDate:
          type: string
          format: date-time
          description: Date associated with the referred document line.
          example: '2024-04-25T13:26:41.911Z'
        LineDetails:
          type: array
          description: Set of elements used to provide the content of the referred document line.
          items:
            type: string
            example: string
            maxLength: 2048
            minLength: 1
            pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,2048})$
          maxItems: 3
          minItems: 0
      nullable: false
    OBActiveCurrencyAndAmount_SimpleType:
      type: string
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      example: '1209.06'
      maxLength: 19
      minLength: 1
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
    BuildingNumber:
      type: string
      description: Number that identifies the position of a building on a street.
      example: 21A
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9 \s]{1,16})$
    CareOf:
      type: string
      description: The 'care of' address is used whenever sending mail to a person or organisation who does not actually live or work at the address. They will receive the mail for the individual.
      example: Arthur Dent
      maxLength: 140
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,140})$
    PostBox:
      type: string
      description: Information that locates and identifies a box in a post office assigned to a person or organization, where letters for them are kept until called for.
      example: '42'
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,16})$
    SubDepartment:
      type: string
      description: Identification of a sub-division of a large organisation or building.
      example: string
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]){1,70}$
    ISODateTime:
      type: string
      format: date-time
      description: "All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
      example: '2017-04-05T10:43:07Z'
    OBInternalFinancialInstitutionIdentification4Code:
      type: string
      description: Name of the identification scheme, in a coded form as published in an external list.
      enum:
      - UK.OBIE.BICFI
      - UK.OBIE.NCC.GB
      example: UK.OBIE.BICFI
    Identification_4:
      type: string
      description: Identification of the party to whom an invoice is issued, when it is different from the debtor or ultimate debtor.
      example: '80200112344562'
      maxLength: 256
      minLength: 1
      pattern: ^[a-zA-Z0-9]{1,256}$
    OBError1:
      type: object
      additionalProperties: false
      deprecated: false
      minProperties: 1
      properties:
        ErrorCode:
          $ref: '#/components/schemas/OBInternalErrorResponseError1Code'
        Message:
          type: string
          description: 'A description of the error that occurred. e.g., ''A mandatory field isn''t supplied'' or ''RequestedExecutionDateTime must be in future''

            OBL doesn''t standardise this field'
          maxLength: 500
          minLength: 1
        Path:
          type: string
          description: Recommended but optional reference to the JSON Path of the field with error, e.g., Data.Initiation.InstructedAmount.Currency
          maxLength: 500
          minLength: 1
        Url:
          type: string
          description: URL to help remediate the problem, or provide more information, or to API Reference, or help etc
      required:
      - ErrorCode
      nullable: false
    OBAddressType2Code:
      type: string
      description: Identifies the nature of the postal address. For a full set of codes see `OBAddressType2Code` [here](https://github.com/OpenBankingUK/External_Internal_CodeSets).
      enum:
      - BIZZ
      - DLVY
      - MLTO
      - PBOX
      - ADDR
      - HOME
      - CORR
      - STAT
      example: BIZZ
    ExternalDocumentType1Code:
      type: string
      description: Specifies the document type as published in an external document type code list. For more information see `ExternalDocumentType1Code` in *ISO_External_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
      enum:
      - CINV
      - CNFA
      - CREN
      - DEBN
      - DISP
      - DNFA
      - HIRI
      - MSIN
      - PUOR
      - SBIN
      - AROI
      - BOLD
      - CMCN
      - SOAC
      - TSUT
      - VCHR
      example: CNFA
    OBRegulatoryReporting1:
      type: object
      additionalProperties: false
      deprecated: false
      description: Information needed due to regulatory and statutory requirements
      properties:
        DebitCreditReportingIndicator:
          type: string
          description: Identifies whether the regulatory reporting information applies to the debit side, to the credit side or to both debit and credit sides of the transaction.  For a full list of values reefer to `OBExternalRegulatoryReportingType1Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
          enum:
          - CRED
          - DEBT
          - BOTH
        Authority:
          $ref: '#/components/schemas/OBRegulatoryAuthority2'
        Details:
          type: array
          items:
            $ref: '#/components/schemas/OBStructuredRegulatoryReporting3'
          maxItems: 3
          minItems: 1
      nullable: false
    Identification_1:
      type: string
      description: Unique and unambiguous identification of a financial institution or a branch of a financial institution.
      example: '10210393826475'
      maxLength: 35
      minLength: 1
      pattern: ^[a-zA-Z0-9]{1,35}$
    StreetName:
      type: string
      description: Name of a street or thoroughfare.
      example: Hamil Road
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]{1,70})$
    OBRemittanceInformation2:
      type: object
      additionalProperties: false
      deprecated: false
      description: Information supplied to enable the matching of an entry with the items that the transfer is intended to settle, such as commercial invoices in an accounts' receivable system
      properties:
        Structured:
          type: array
          items:
            $ref: '#/components/schemas/OBRemittanceInformationStructured'
          maxItems: 5
          minItems: 1
        Unstructured:
          type: array
          description: Information supplied to enable the matching/reconciliation of an entry with the items that the payment is intended to settle, such as commercial invoices in an accounts' receivable system, in an unstructured form.
          items:
            type: string
            example: string
            maxLength: 140
            minLength: 1
            pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;:&+]{1,140})$
          maxItems: 4
          minItems: 1
      nullable: false
    OBActiveOrHistoricCurrencyAndAmount:
      type: object
      additionalProperties: false
      deprecated: false
      description: Amount of money associated with the charge type.
      properties:
        Amount:
          $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
      required:
      - Amount
      - Currency
      nullable: false
    OBProxy1:
      type: object
      additionalProperties: false
      deprecated: false
      description: Specifies an alternate assumed name for the identification of the account.
      properties:
        Identification:
          type: string
          description: Identification used to indicate the account identification under another specified name.
          example: 08080021325698
          maxLength: 2048
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,2048})$
        Code:
          $ref: '#/components/schemas/ExternalProxyAccountType1Code'
        Type:
          type: string
          description: Type of the proxy identification.
          example: Telephone
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,35})$
      required:
      - Code
      - Identification
      nullable: false
    ExternalCategoryPurpose1Code:
      type: string
      description: "Enumeration of codes that outlines the type of purpose behind a transaction, payment or risk. \n For all enum values see `ExternalCategoryPurpose1Code` [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)"
      enum:
      - BONU
      - CASH
      - CBLK
      - CCRD
      - CGWV
      - CIPC
      - CONC
      - CORT
      - DCRD
      - DIVI
      - DVPM
      - EPAY
      - FCDT
      - FCIN
      - FCOL
      - GOVT
      - GP2P
      - HEDG
      - ICCP
      - IDCP
      - INTC
      - INTE
      - LBOX
      - LOAN
      - MP2B
      - MP2P
      - OTHR
      - PENS
      - RPRE
      - RRCT
      - RVPM
      - SALA
      - SECU
      - SSBE
      - SUPP
      - SWEP
      - TAXS
      - TOPG
      - TRAD
      - TREA
      - VATX
      - VOST
      - WHLD
      - ZABA
      example: BONU
    OBInternalExtendedAccountType1Code:
      type: string
      description: Specifies the extended type of account.
      enum:
      - Business
      - BusinessSavingsAccount
      - Charity
      - Collection
      - Corporate
      - Ewallet
      - Government
      - Investment
      - ISA
      - JointPersonal
      - Pension
      - Personal
      - PersonalSavingsAccount
      - Premier
      - Wealth
      example: ISA
    OBMandateRelatedInformation1:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        MandateIdentification:
          $ref: '#/components/schemas/Identification_1'
        Classification:
          $ref: '#/components/schemas/OBExternalMandateClassification1Code'
        CategoryPurposeCode:
          $ref: '#/components/schemas/ExternalCategoryPurpose1Code'
        FirstPaymentDateTime:
          type: string
          format: date-time
        RecurringPaymentDateTime:
          type: string
          format: date-time
          description: "The date on which the first recurring payment for a Standing Order schedule will be made. \nUsage: This must be populated only if the first recurring date is different to the first payment date. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
          example: '2017-04-05T10:43:07Z'
        FinalPaymentDateTime:
          type: string
          format: date-time
        Frequency:
          $ref: '#/components/schemas/OBFrequency6'
        Reason:
          type: string
          description: Reason for the direct debit mandate to allow the user to distinguish between different mandates for the same creditor.
          example: reason
          maxLength: 256
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,256})$
      required:
      - Frequency
      nullable: false
    Floor:
      type: string
      description: Number that identifies the level within a building
      example: '10'
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,70})$
    CountrySubDivision:
      type: string
      description: Identifies a subdivision of a country such as state, region, county.
      example: Manchester, Lancaster
      maxLength: 35
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9\- '.,]){1,35}$
    CountryCode:
      type: string
      description: Nation with its own government.
      example: US
      maxLength: 2
      minLength: 2
      pattern: ^[A-Z]{2,2}$
    OBStructuredRegulatoryReporting3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Set of elements used to provide details on the regulatory reporting information.
      properties:
        Type:
          type: string
          description: Specifies the type of the information supplied in the regulatory reporting details
          example: type
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,35})$
        Date:
          $ref: '#/components/schemas/ISODateTime'
        Country:
          $ref: '#/components/schemas/CountryCode'
        Amount:
          $ref: '#/components/schemas/OBActiveOrHistoricCurrencyAndAmount'
        Information:
          type: array
