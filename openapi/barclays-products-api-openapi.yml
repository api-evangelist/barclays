openapi: 3.2.0
info:
  title: Account and Transactions Products API
  description: To retrieve account information for Barclays customers
  termsOfService: https://www.openbanking.org.uk/terms
  contact:
    name: Service Desk
    url: https://www.openbanking.org.uk
    email: ServiceDesk@openbanking.org.uk
  license:
    name: open-licence
    url: https://www.openbanking.org.uk/open-licence
  version: v4.0
tags:
- name: Products
  description: Get Products
paths:
  /accounts/{accountId}/product:
    summary: Get Products
    description: Get Products
    get:
      tags:
      - Products
      summary: Get Product for an AccountId
      description: Enables an AISP to retrieve the account product information for a specific PSU account.
      operationId: GetAccountsAccountIdProduct
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/x-fapi-auth-date'
      - $ref: '#/components/parameters/x-fapi-customer-ip-address'
      - $ref: '#/components/parameters/x-fapi-interaction-id'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsAccountIdProductRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '500':
          $ref: '#/components/responses/500Error'
        '403':
          $ref: '#/components/responses/403Error'
        '404':
          $ref: '#/components/responses/404Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
      deprecated: false
  /products:
    summary: Get Products
    description: Get Products
    get:
      tags:
      - Products
      summary: Get Products
      description: Enables an AISP to retrieve the account product information for account(s) that the PSU has consented to.
      operationId: GetProducts
      parameters:
      - $ref: '#/components/parameters/x-fapi-auth-date'
      - $ref: '#/components/parameters/x-fapi-customer-ip-address'
      - $ref: '#/components/parameters/x-fapi-interaction-id'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '500':
          $ref: '#/components/responses/500Error'
        '405':
          $ref: '#/components/responses/405Error'
      deprecated: false
components:
  responses:
    403Error:
      description: Forbidden
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            403ErrorResponse:
              value:
                Code: OB.BadRequest
                Id: 2b5f0fb2-730b-11e8-adc0-fa7ae01bbebc
                Message: Invalid request parameters
                Errors:
                - ErrorCode: AC17
                  Message: Version must be supplied
                  Path: Data.Initiation
                  Url: <url to the api reference for Event Notification API>
                - ErrorCode: AC17
                  Message: Version supplied is not valid
                  Path: Data.Initiation.CreditorAccount
                  Url: <url to the api reference for Event Notification API>
    429Error:
      description: Too Many Requests
      headers:
        Retry-After:
          description: Number in seconds to wait
          schema:
            type: integer
            deprecated: false
            maximum: 9999999
            minimum: 1
            nullable: false
          example: 120
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
    400Error:
      description: Bad request
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            400ErrorResponse:
              value:
                Code: OB.BadRequest
                Id: 2b5f0fb2-730b-11e8-adc0-fa7ae01bbebc
                Message: Invalid request parameters
                Errors:
                - ErrorCode: AC17
                  Message: Version must be supplied
                  Path: Data.Initiation
                  Url: <url to the api reference for Event Notification API>
                - ErrorCode: AC17
                  Message: Version supplied is not valid
                  Path: Data.Initiation.CreditorAccount
                  Url: <url to the api reference for Event Notification API>
    404Error:
      description: Not found
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
    500Error:
      description: Internal Server Error
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBErrorResponse1'
          examples:
            500ErrorResponse:
              value:
                Code: OB.BadRequest
                Id: 2b5f0fb2-730b-11e8-adc0-fa7ae01bbebc
                Message: Invalid request parameters
                Errors:
                - ErrorCode: AC17
                  Message: Version must be supplied
                  Path: Data.Initiation
                  Url: <url to the api reference for Event Notification API>
                - ErrorCode: AC17
                  Message: Version supplied is not valid
                  Path: Data.Initiation.CreditorAccount
                  Url: <url to the api reference for Event Notification API>
    200AccountsAccountIdProductRead:
      description: Products Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBReadProduct2'
          examples:
            get-accounts-product-response:
              value:
                Data:
                  Product:
                  - AccountId: '22289'
                    ProductId: 51B
                    SecondaryProductId: CA78
                    MarketingStateId: '22878123'
                    ProductType: PersonalCurrentAccount
                    ProductName: 321 Product
                    PCA: {}
                    BCA: {}
                Links:
                  Self: https://api.alphabank.com/open-banking/v4.0/aisp/accounts/22289/product
                Meta:
                  TotalPages: 1
    405Error:
      description: Method Not Allowed
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
    401Error:
      description: Unauthorized
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
    406Error:
      description: Not Acceptable
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
  schemas:
    OB_CodeMnemonic:
      type: string
      description: The four letter Mnemonic used within an XML file to identify a code
      pattern: ^\w{0,4}$
    OB_Amount1_1:
      type: string
      description: Every additional tranche of an overdraft balance to which an overdraft fee is applied
      pattern: ^(-?\d{1,14}){1}(\.\d{1,4}){0,1}$
    OB_Amount1_2:
      type: string
      description: Amount charged for an overdraft fee/charge (where it is charged in terms of an amount rather than a rate)
      pattern: ^(-?\d{1,14}){1}(\.\d{1,4}){0,1}$
    OB_InterestRateType1Code_0:
      type: string
      description: Rate type for overdraft fee/charge (where it is charged in terms of a rate rather than an amount)
      enum:
      - INBB
      - INFR
      - INGR
      - INLR
      - INNE
      - INOT
    OB_InterestRateType1Code_1:
      type: string
      description: Rate type for Fee/Charge (where it is charged in terms of a rate rather than an amount)
      enum:
      - INBB
      - INFR
      - INGR
      - INLR
      - INNE
      - INOT
    ISODateTime:
      type: string
      format: date-time
      description: "All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
    OBError1:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ErrorCode:
          $ref: '#/components/schemas/OBExternalStatusReason1Code'
        Message:
          type: string
          description: 'A description of the error that occurred. e.g., ''A mandatory field isn''t supplied'' or ''RequestedExecutionDateTime must be in future''

            OBL doesn''t standardise this field'
          maxLength: 500
          minLength: 1
        Path:
          type: string
          description: Recommended but optional reference to the JSON Path of the field with error, e.g., Data.Initiation.InstructedAmount.Currency
          maxLength: 500
          minLength: 1
        Url:
          type: string
          description: URL to help remediate the problem, or provide more information, or to API Reference, or help etc
      required:
      - ErrorCode
    OB_OtherCodeType1_1:
      type: object
      additionalProperties: false
      deprecated: false
      description: Other application frequencies that are not available in the standard code list
      properties:
        Code:
          $ref: '#/components/schemas/OB_CodeMnemonic'
        Name:
          $ref: '#/components/schemas/Name_4'
        Description:
          $ref: '#/components/schemas/Description_3'
      required:
      - Description
      - Name
      nullable: false
    OB_OverdraftFeeType1Code:
      type: string
      description: Overdraft fee type
      enum:
      - FBAO
      - FBAR
      - FBEB
      - FBIT
      - FBOR
      - FBOS
      - FBSC
      - FBTO
      - FBUB
      - FBUT
      - FTOT
      - FTUT
    Name_4:
      type: string
      description: Long name associated with the code
      maxLength: 70
      minLength: 1
    OB_InterestFixedVariableType1Code:
      type: string
      description: Type of interest rate, Fixed or Variable
      enum:
      - INFI
      - INVA
    OB_Amount1_3:
      type: string
      description: Fee Amount charged for a fee/charge (where it is charged in terms of an amount rather than a rate)
      pattern: ^(-?\d{1,14}){1}(\.\d{1,4}){0,1}$
    OB_Period1Code:
      type: string
      description: Period e.g. day, week, month etc. for which the fee/charge is capped
      enum:
      - PACT
      - PDAY
      - PHYR
      - PMTH
      - PQTR
      - PWEK
      - PYER
    OB_InterestCalculationMethod1Code:
      type: string
      description: Methods of calculating interest
      enum:
      - ITCO
      - ITOT
      - ITSI
    OB_FeeFrequency1Code_4:
      type: string
      description: Period e.g. day, week, month etc. for which the fee/charge is capped
      enum:
      - FEAC
      - FEAO
      - FECP
      - FEDA
      - FEHO
      - FEI
      - FEMO
      - FEOA
      - FEOT
      - FEPC
      - FEPH
      - FEPO
      - FEPS
      - FEPT
      - FEPTA
      - FEPTP
      - FEQU
      - FESM
      - FEST
      - FEWE
      - FEYE
    OB_Rate1_0:
      type: string
      description: Rate charged for overdraft fee/charge (where it is charged in terms of a rate rather than an amount)
      pattern: ^(-?\d{1,3}){1}(\.\d{1,4}){0,1}$
    OB_FeeFrequency1Code_0:
      type: string
      description: Frequency at which the overdraft charge is applied to the account
      enum:
      - FEAC
      - FEAO
      - FECP
      - FEDA
      - FEHO
      - FEI
      - FEMO
      - FEOA
      - FEOT
      - FEPC
      - FEPH
      - FEPO
      - FEPS
      - FEPT
      - FEPTA
      - FEPTP
      - FEQU
      - FESM
      - FEST
      - FEWE
      - FEYE
    Number_1:
      type: integer
      description: fee/charges are captured dependent on the number of occurrences rather than capped at a particular amount
      example: 1
      maximum: 9999999
      minimum: 0
    Meta:
      type: object
      additionalProperties: false
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          type: integer
          format: int32
          example: 42
          maximum: 999999
          minimum: 0
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      title: MetaData
    OB_FeeCategory1Code:
      type: string
      description: Categorisation of fees and charges into standard categories.
      enum:
      - FCOT
      - FCRE
      - FCSV
    Description_3:
      type: string
      description: Description to describe the purpose of the code
      maxLength: 350
      minLength: 1
    OBReadProduct2:
      type: object
      additionalProperties: false
      deprecated: false
      description: Product details of Other Product which is not available in the standard list
      properties:
        Data:
          type: object
          description: Aligning with the read write specs structure.
          properties:
            Product:
              type: array
              items:
                type: object
                description: Product details associated with the Account
                properties:
                  ProductName:
                    type: string
                    description: The name of the Product used for marketing purposes from a customer perspective. I.e. what the customer would recognise.
                    example: 321 Product
                    maxLength: 350
                    minLength: 1
                  ProductId:
                    type: string
                    description: Identifier within the parent organisation for the product. Must be unique in the organisation
                    example: 51B
                    maxLength: 40
                    minLength: 1
                  AccountId:
                    $ref: '#/components/schemas/AccountId'
                  SecondaryProductId:
                    type: string
                    description: Any secondary Identification which supports Product Identifier to uniquely identify the current account banking products.
                    example: CA78
                    maxLength: 70
                    minLength: 1
                  ProductType:
                    type: string
                    description: Descriptive code for the product category.  For a full list refer to `OBInternalProductType1Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)<br /><br /> If ProductType - "Other" is chosen, the object OtherProductType must be populated with name, and description.
                    enum:
                    - BusinessCurrentAccount
                    - CommercialCreditCard
                    - Other
                    - PersonalCurrentAccount
                    - SMELoan
                    example: PersonalCurrentAccount
                  MarketingStateId:
                    type: string
                    description: Unique and unambiguous identification of a Product Marketing State.
                    example: '22878123'
                    maxLength: 35
                    minLength: 1
                  OtherProductType:
                    type: object
                    description: This field provides extension to the ProductType enumeration. If ProductType - "Other" is chosen, this field must be populated with name, and description for ASPSP specific product type.
                    properties:
                      Name:
                        type: string
                        description: Name of "Other" product type.
                        example: e-Wallet
                        maxLength: 350
                        minLength: 1
                      Description:
                        type: string
                        description: Description of "Other" product type
                        example: Virtual wallet
                        maxLength: 350
                        minLength: 1
                      ProductDetails:
                        type: object
                        properties:
                          Segment:
                            type: array
                            items:
                              type: string
                              description: 'Market segmentation is a marketing term referring to the aggregating of prospective buyers into groups, or segments, that have common needs and respond similarly to a marketing action. Market segmentation enables companies to target different categories of consumers who perceive the full value of certain products and services differently from one another.

                                Read more: Market Segmentation http://www.investopedia.com/terms/m/marketsegmentation.asp#ixzz4gfEEalTd '
                              enum:
                              - GEAS
                              - GEBA
                              - GEBR
                              - GEBU
                              - GECI
                              - GECS
                              - GEFB
                              - GEFG
                              - GEG
                              - GEGR
                              - GEGS
                              - GEOT
                              - GEOV
                              - GEPA
                              - GEPR
                              - GERE
                              - GEST
                              - GEYA
                              - GEYO
                              - PSCA
                              - PSES
                              - PSNC
                              - PSNP
                              - PSRG
                              - PSSS
                              - PSST
                              - PSSW
                            maxItems: 99999
                            minItems: 0
                          FeeFreeLength:
                            type: integer
                            description: The length/duration of the fee free period
                            example: 12
                            maximum: 9999999
                            minimum: 0
                          FeeFreeLengthPeriod:
                            type: string
                            description: The unit of period (days, weeks, months etc.) of the promotional length
                            enum:
                            - PACT
                            - PDAY
                            - PHYR
                            - PMTH
                            - PQTR
                            - PWEK
                            - PYER
                          MonthlyMaximumCharge:
                            type: string
                            description: The maximum relevant charges that could accrue as defined fully in Part 7 of the CMA order
                            pattern: ^(-?\d{1,14}){1}(\.\d{1,4}){0,1}$
                          Notes:
                            type: array
                            items:
                              type: string
                              description: Optional additional notes to supplement the Core product details
                              maxLength: 2000
                              minLength: 1
                            maxItems: 99999
                            minItems: 0
                          OtherSegment:
                            $ref: '#/components/schemas/OB_OtherCodeType1_0'
                      CreditInterest:
                        type: object
                        description: Details about the interest that may be payable to the Account holders
                        properties:
                          TierBandSet:
                            type: array
                            items:
                              type: object
                              description: The group of tiers or bands for which credit interest can be applied.
                              properties:
                                TierBandMethod:
                                  type: string
                                  description: 'The methodology of how credit interest is paid/applied. It can be:-

                                    1. Banded

                                    Interest rates are banded. i.e. Increasing rate on whole balance as balance increases.

                                    2. Tiered

                                    Interest rates are tiered. i.e. increasing rate for each tier as balance increases, but interest paid on tier fixed for that tier and not on whole balance.

                                    3. Whole

                                    The same interest rate is applied irrespective of the product holder''s account balance'
                                  enum:
                                  - INBA
                                  - INTI
                                  - INWH
                                CalculationMethod:
                                  $ref: '#/components/schemas/OB_InterestCalculationMethod1Code'
                                Destination:
                                  type: string
