        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
      - name: PSU-Accept-Charset
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-Accept-Encoding
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-User-Agent
        in: header
        description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
          maxLength: 200
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,200})$
      - name: PSU-Accept-Language
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
      - name: PSU-Http-Method
        in: header
        description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

          - GET

          - POST

          - PUT

          - PATCH

          - DELETE'
        required: false
        schema:
          type: string
          description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

            - GET

