openapi: 3.2.0
info:
  title: Barclays Accounts API
  version: '1.0'
  description: 'Operations tagged Accounts across 2 of this provider''s published API definitions: barclays-account-and-transactions-openapi.json, barclays-bank-ireland-account-information-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Accounts
  description: Get Accounts
paths:
  /accounts/{accountId}:
    summary: Get Accounts
    description: Get Accounts
    get:
      tags:
      - Accounts
      summary: Get an Account by AccountId
      description: Enables an AISP to retrieve information about a specific PSU account.
      operationId: GetAccountsAccountId
      parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/x-fapi-auth-date'
      - $ref: '#/components/parameters/x-fapi-customer-ip-address'
      - $ref: '#/components/parameters/x-fapi-interaction-id'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsAccountIdRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '500':
          $ref: '#/components/responses/500Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
      deprecated: false
  /accounts:
    summary: Get Accounts
    description: Get Accounts
    get:
      tags:
      - Accounts
      summary: Get Accounts
      description: Enables an AISP to retrieve a list of a PSU's accounts and information about those account(s) that the PSU has consented to.
      operationId: GetAccounts
      parameters:
      - $ref: '#/components/parameters/x-fapi-auth-date'
      - $ref: '#/components/parameters/x-fapi-customer-ip-address'
      - $ref: '#/components/parameters/x-fapi-interaction-id'
      - $ref: '#/components/parameters/Authorization'
      - $ref: '#/components/parameters/x-customer-user-agent'
      responses:
        '200':
          $ref: '#/components/responses/200AccountsRead'
        '400':
          $ref: '#/components/responses/400Error'
        '401':
          $ref: '#/components/responses/401Error'
        '500':
          $ref: '#/components/responses/500Error'
        '403':
          $ref: '#/components/responses/403Error'
        '405':
          $ref: '#/components/responses/405Error'
        '406':
          $ref: '#/components/responses/406Error'
        '429':
          $ref: '#/components/responses/429Error'
      deprecated: false
  /accounts/{account-id}:
    get:
      description: Retrieve basic information of a specific account based on given account id
      operationId: get_accounts__account-id_
      parameters:
      - name: PSU-IP-Address
        in: header
        description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
        required: false
        schema:
          type: string
          description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
          maxLength: 39
          minLength: 2
          pattern: ^((?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])))$
      - name: X-Request-ID
        in: header
        description: ID of the request, unique to the call, as determined by the initiating party.
        required: true
        schema:
          type: string
          description: ID of the request, unique to the call, as determined by the initiating party.
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: PSU-IP-Port
        in: header
        description: The forwarded IP Port header field consists of the corresponding HTTP request IP Port field between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Port header field consists of the corresponding HTTP request IP Port field between PSU and TPP, if available.
          maxLength: 10
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#\/]{1,10})$
      - name: PSU-Accept
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
      - name: PSU-Accept-Charset
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-Accept-Encoding
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-User-Agent
        in: header
        description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
          maxLength: 200
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,200})$
      - name: PSU-Accept-Language
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
      - name: PSU-Http-Method
        in: header
        description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

          - GET

          - POST

          - PUT

          - PATCH

          - DELETE'
        required: false
        schema:
          type: string
          description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

            - GET

            - POST

            - PUT

            - PATCH

            - DELETE

            '
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      - name: PSU-Device-ID
        in: header
        description: UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available. UUID identifies either a device or a device dependent application installation. In case of an installation identification this ID needs to be unaltered until removal from device.
        required: false
        schema:
          type: string
          description: UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available. UUID identifies either a device or a device dependent application installation. In case of an installation identification this ID needs to be unaltered until removal from device.
          maxLength: 36
          minLength: 36
          pattern: ^(?!\s)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: PSU-Geo-Location
        in: header
        description: The forwarded Geo Location of the corresponding HTTP request between PSU and TPP if available
        required: false
        schema:
          type: string
          description: The forwarded Geo Location of the corresponding HTTP request between PSU and TPP if available
          maxLength: 27
          minLength: 23
          pattern: ^(?!\s)(GEO:)[0-9]{1,3}\.[-][0-9]{6}\,[-][0-9]{1,3}\.[0-9]{6}
      - name: Consent-ID
        in: header
        description: Consent Id already stored on the ASPSP system
        required: true
        schema:
          type: string
          description: Consent Id already stored on the ASPSP system
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: withBalance
        in: query
        description: Filter to fetch the list of accessible payment accounts including the booking balance, if granted by the PSU in the related consent and available by the ASPSP.
        required: true
        schema:
          type: boolean
          description: Filter to fetch the list of accessible payment accounts including the booking balance, if granted by the PSU in the related consent and available by the ASPSP.
      - name: account-id
        in: path
        description: This identification is denoting the addressed account.
        required: true
        schema:
          type: string
          description: This identification is denoting the addressed account.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_account_details_response'
              example: null
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsAccountIdTransactionsTransactionid400Response'
              example: null
        '401':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsAccountIdTransactionsTransactionid401Response'
              example: null
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsAccountIdTransactionsTransactionid404Response'
              example: null
      tags:
      - Accounts
      summary: Get accounts account id
      x-summary-source: derived
  /accounts/{account-id}/transactions:
    get:
      description: Retrieve transaction reports or transaction lists of a given account ddressed by "account-id", depending on the steering parameter "bookingStatus" together with balances
      operationId: get_accounts__account-id__transactions
      parameters:
      - name: PSU-IP-Address
        in: header
        description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
        required: false
        schema:
          type: string
          description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
          maxLength: 39
          minLength: 2
          pattern: ^((?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])))$
      - name: X-Request-ID
