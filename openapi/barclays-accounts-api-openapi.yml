        required: true
        schema:
          type: string
          description: Consent Id already stored on the ASPSP system
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: Accept
        in: header
        description: Accept header
        required: false
        schema:
          type: string
          description: Accept header
          enum:
          - application/json
      - name: bookingStatus
        in: query
        description: Filters the transactions by booking status
        required: true
        schema:
          type: string
          description: Filters the transactions by booking status
          enum:
          - booked
          - pending
          - both
          - information
      - name: dateFrom
        in: query
        description: Starting date (inclusive the date dateFrom) of the transaction list, mandated if no delta access is required.For booked transactions, the relevant date is the booking date.For pending transactions, the relevant date is the entry date, which may not be transparent neither in this API nor other channels of the ASPSP.
        required: false
        schema:
          type: string
          format: date
          description: Starting date (inclusive the date dateFrom) of the transaction list, mandated if no delta access is required.For booked transactions, the relevant date is the booking date.For pending transactions, the relevant date is the entry date, which may not be transparent neither in this API nor other channels of the ASPSP.
      - name: dateTo
        in: query
        description: End date (inclusive the data dateTo) of the transaction list, default is "now" if not given.For booked transactions, the relevant date is the booking date.For pending transactions, the relevant date is the entry date, which may not be transparent neither in this API nor other channels of the ASPSP
        required: false
        schema:
          type: string
          format: date
          description: End date (inclusive the data dateTo) of the transaction list, default is "now" if not given.For booked transactions, the relevant date is the booking date.For pending transactions, the relevant date is the entry date, which may not be transparent neither in this API nor other channels of the ASPSP
