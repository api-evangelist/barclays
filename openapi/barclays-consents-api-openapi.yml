openapi: 3.2.0
info:
  title: Barclays Consents API
  version: v1.3.0
  description: 'Operations tagged Consents across 2 of this provider''s published API definitions: barclays-bank-ireland-account-information-openapi.json, barclays-bank-ireland-confirmation-of-funds-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Consents
paths:
  /consents/{consentId}/authorisations/{authorisationId}:
    get:
      description: Retrieves the SCA status of a consent initiation's authorisation sub-resource.
      operationId: get_consents__consentId__authorisations__authorisationId_
      parameters:
      - name: PSU-IP-Address
        in: header
        description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
        required: false
        schema:
          type: string
          description: Consists of the corresponding HTTP request IP Address field between PSU and TPP. It shall be contained if and only if this request was actively initiated by the PSU
          maxLength: 39
          minLength: 2
          pattern: ^((?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)|(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])))$
      - name: X-Request-ID
        in: header
        description: ID of the request, unique to the call, as determined by the initiating party.
        required: true
        schema:
          type: string
          description: ID of the request, unique to the call, as determined by the initiating party.
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: PSU-IP-Port
        in: header
        description: The forwarded IP Port header field consists of the corresponding HTTP request IP Port field between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Port header field consists of the corresponding HTTP request IP Port field between PSU and TPP, if available.
          maxLength: 10
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#\/]{1,10})$
      - name: PSU-Accept
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
      - name: PSU-Accept-Charset
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-Accept-Encoding
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available
          maxLength: 100
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,100})$
      - name: PSU-User-Agent
        in: header
        description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded Agent header field of the HTTP request between PSU and TPP, if available.
          maxLength: 200
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-., '()="_@£$#/]{1,200})$
      - name: PSU-Accept-Language
        in: header
        description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
        required: false
        schema:
          type: string
          description: The forwarded IP Accept header fields consist of the corresponding HTTP request Accept header fields between PSU and TPP, if available.
          maxLength: 100
          minLength: 1
      - name: PSU-Http-Method
        in: header
        description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

          - GET

          - POST

          - PUT

          - PATCH

          - DELETE'
        required: false
        schema:
          type: string
          description: 'HTTP method used at the interface between PSU and TPP, if available. Valid values are:

            - GET

            - POST

            - PUT

            - PATCH

            - DELETE

            '
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      - name: PSU-Device-ID
        in: header
        description: UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available. UUID identifies either a device or a device dependent application installation. In case of an installation identification this ID needs to be unaltered until removal from device.
        required: false
        schema:
          type: string
          description: UUID (Universally Unique Identifier) for a device, which is used by the PSU, if available. UUID identifies either a device or a device dependent application installation. In case of an installation identification this ID needs to be unaltered until removal from device.
          maxLength: 36
          minLength: 36
          pattern: ^(?!\s)[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      - name: PSU-Geo-Location
        in: header
        description: The forwarded Geo Location of the corresponding HTTP request between PSU and TPP if available
        required: false
        schema:
          type: string
          description: The forwarded Geo Location of the corresponding HTTP request between PSU and TPP if available
          maxLength: 27
          minLength: 23
          pattern: ^(?!\s)(GEO:)[0-9]{1,3}\.[-][0-9]{6}\,[-][0-9]{1,3}\.[0-9]{6}
      - name: authorisationId
        in: path
        description: Resource Identification of the related SCA
        required: true
        schema:
          type: string
          description: Resource Identification of the related SCA
          maxLength: 2
          minLength: 1
          pattern: ^\d{1,2}$
      - name: consentId
        in: path
        description: Consent Id
        required: true
        schema:
          type: string
          description: Consent Id
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/get_consent_authorisation_details_response'
              example: null
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsAccountIdTransactionsTransactionid400Response'
              example: null
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccountsAccountIdTransactionsTransactionid404Response'
              example: null
      tags:
      - Consents
      summary: Get consents consent id authorisations authorisation id
      x-summary-source: derived
