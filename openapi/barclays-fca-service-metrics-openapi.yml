          - LastUpdated
          - License
          - TermsOfUse
          - TotalResults
          title: Meta data
        data:
          type: array
          items:
            type: object
            description: Brand owned by an organisation
            properties:
              Brand:
                type: array
                additionalProperties: false
                description: Brand owned by an organisation
                items:
                  type: object
                  description: Brand owned by an organisation
                  properties:
                    BrandName:
                      type: string
                      description: Brand Name that an organisation uses to market its products or services to a consumer
                      maxLength: 140
                      minLength: 1
                      title: BrandName
                    PublicationDate:
                      type: string
                      format: date
                      description: Date when this metrics was made available.
                      title: PublicationDate
                    MeasurementPeriodStartDate:
                      type: string
                      format: date
                      description: The start date of the current account measurement period
                      title: MeasurementPeriodStartDate
                    MeasurementPeriodEndDate:
                      type: string
                      format: date
                      description: The end date of the current account measurement period
                      title: MeasurementPeriodEndDate
                    Notes:
                      type: string
                      description: Specify any note that helps Banks to describe the Service Metrics Data related to a particular
                        Brand. One example to describe, why the Service Metrics data is not available.
                      maxLength: 2000
                      minLength: 1
                      title: Notes
                    ServicesMatterAvailability:
                      type: object
                      additionalProperties: false
                      description: This section hold info related to Matters(Services) which can be discussed by Banks customer.
                      properties:
                        ServicesMatterAvailabilityDetails:
                          type: array
                          additionalProperties: false
                          description: Hold info related to Services which can be discussed by an account holder
                          items:
                            type: object
                            description: Hold info related to Services which can be discussed by an account holder
                            properties:
                              MatterType:
                                type: string
                                enum:
                                - HelpOpeningAccount
                                - CheckBalanceTransaction
                                - CancellingCheque
                                - CashWithdrawalForexOutsideUK
                                - CollectPaymentViaCard
                                - SendingMoneyOutsideUK
                                - ReportFraudulentIncident
                                - DenialLackOfFunds
                                - Other
                                - PayingInCheque
                                - ProgressAccountCardSuspension
                                - ProblemUsingMobileInternetBanking
                                - SendingMoneyWithinUK
                                - AccessViaPowerOfAttorney
                                title: MatterType
                              24HourHelp:
                                type: string
                                description: Indicates whether this contact type  is available 24 hours.
                                enum:
                                - InSomeCases
                                - NotPossible
                                - 'No'
                                - 'Yes'
                                title: 24HourHelp
                              OtherMatterType:
                                type: array
                                additionalProperties: false
                                description: Other code set which is not available in the standard MatterAvailabilityCode
                                  set
                                items:
                                  type: object
                                  description: Other code set which is not available in the standard MatterAvailabilityCode
                                    set
                                  properties:
                                    Code:
                                      type: string
                                      description: The four letter Mnemonic used within an XML file to identify a code
                                      maxLength: 4
                                      minLength: 0
                                      pattern: ^\w{0,4}$
                                      title: Code
                                    Name:
                                      type: string
                                      description: Long name associated with the code
                                      maxLength: 70
                                      minLength: 1
                                      title: Name
                                    Description:
                                      type: string
                                      description: Description to describe the purpose of the code
                                      maxLength: 350
                                      minLength: 1
                                      title: Description
                                  required:
                                  - Description
                                  - Name
                                title: OtherMatterType
                              ContactDetails:
                                type: array
                                additionalProperties: false
                                description: Describes the communication channel detail which can be used by an account holder
                                  to either discuss a matter or do action
                                items:
                                  type: object
                                  description: Describes the communication channel detail which can be used by an account
                                    holder to either discuss a matter or do action
                                  properties:
                                    ContactType:
                                      type: string
                                      description: Contact type such Phone, Fax and email
                                      enum:
                                      - Email
                                      - MobileApp
                                      - Other
                                      - Phone
                                      - WebChatApp
                                      title: ContactType
                                    ContactContent:
                                      type: string
                                      description: Collection of information that identifies a phone/ email/WebChat/ Mobile
                                        App or other communication channel, as defined by telecom services.
                                      maxLength: 256
                                      minLength: 1
                                      title: ContactContent
                                    ContactDescription:
                                      type: string
                                      description: Description of contact such as main phone number, alternate phone number
                                        and WebChat App name.
                                      maxLength: 70
                                      minLength: 1
                                      title: ContactDescription
                                    OtherContactType:
                                      type: object
                                      additionalProperties: false
                                      description: Other contact type which is not in the standard code list
                                      properties:
                                        Code:
                                          type: string
                                          description: The four letter Mnemonic used within an XML file to identify a code
                                          maxLength: 4
                                          minLength: 0
                                          pattern: ^\w{0,4}$
                                          title: Code
                                        Name:
                                          type: string
                                          description: Long name associated with the code
                                          maxLength: 70
                                          minLength: 1
                                          title: Name
                                        Description:
                                          type: string
                                          description: Description to describe the purpose of the code
                                          maxLength: 350
                                          minLength: 1
                                          title: Description
                                      required:
                                      - Description
                                      - Name
                                      title: OtherContactType
                                  required:
                                  - ContactContent
                                  - ContactType
                                title: ContactDetails
                              ServiceMatterAvailabilityMethod:
                                type: array
                                additionalProperties: false
                                description: Store info related to Matters(services) which an account holder can contact the
                                  bank and discuss about them
                                items:
                                  type: object
                                  description: Store info related to Matters(services) which an account holder can contact
