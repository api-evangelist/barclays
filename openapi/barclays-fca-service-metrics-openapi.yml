      type: object
      additionalProperties: false
      properties:
        meta:
          type: object
          additionalProperties: false
          properties:
            LastUpdated:
              type: string
              format: date-time
            TotalResults:
              type: integer
            Agreement:
              type: string
              enum:
              - Use of the APIs and any related data will be subject to the terms of the Open Licence and subject to terms
