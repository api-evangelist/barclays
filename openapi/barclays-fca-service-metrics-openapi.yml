                                  properties:
                                    MatterMethodType:
                                      type: string
                                      description: Channel(methods) which can used to contact banks to discuss a matter(service)
                                      enum:
                                      - InternetBanking
                                      - MobileBanking
                                      - Other
                                      - Telephone
                                      title: MatterMethodType
