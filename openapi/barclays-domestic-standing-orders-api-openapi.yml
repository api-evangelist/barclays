components:
  schemas:
    OBWriteDomesticStandingOrderResponse6:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Data:
          type: object
          additionalProperties: false
          properties:
            DomesticStandingOrderId:
              type: string
              description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the domestic standing order resource.'
              maxLength: 40
              minLength: 1
            ConsentId:
              type: string
              description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the consent resource.'
              example: BARCLAYS-P-12345678901234
              maxLength: 25
              minLength: 1
              pattern: ^BARCLAYS-P-\d{14}$
            CreationDateTime:
              type: string
              format: date-time
              description: "Date and time at which the resource was created. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            Status:
              $ref: '#/components/schemas/ExternalPaymentTransactionStatus1Code'
            StatusUpdateDateTime:
              type: string
              format: date-time
              description: "Date and time at which the resource status was updated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            StatusReason:
              type: array
              items:
                $ref: '#/components/schemas/OBStatusReason'
              maxItems: 99999
              minItems: 0
            Refund:
              $ref: '#/components/schemas/OBDomesticRefundAccount1'
            Charges:
              type: array
              items:
                type: object
                additionalProperties: false
                description: Set of elements used to provide details of a charge for the payment initiation.
                properties:
                  ChargeBearer:
                    $ref: '#/components/schemas/OBInternalChargeBearerType1Code'
                  Type:
                    $ref: '#/components/schemas/OBInternalPaymentChargeType1Code'
                  Amount:
                    $ref: '#/components/schemas/OBActiveOrHistoricCurrencyAndAmount'
                required:
                - Amount
                - ChargeBearer
                - Type
              maxItems: 99999
              minItems: 0
            Initiation:
              type: object
              additionalProperties: false
              description: The Initiation payload is sent by the initiating party to the ASPSP. It is used to request movement of funds from the debtor account to a creditor for a domestic standing order.
              properties:
                RemittanceInformation:
                  $ref: '#/components/schemas/OBRemittanceInformation2'
                NumberOfPayments:
                  $ref: '#/components/schemas/NumberOfPayments'
                FirstPaymentAmount:
                  type: object
                  additionalProperties: false
                  description: The amount of the first Standing Order
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                RecurringPaymentAmount:
                  type: object
                  additionalProperties: false
                  description: The amount of the recurring Standing Order
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                FinalPaymentAmount:
                  type: object
                  additionalProperties: false
                  description: The amount of the final Standing Order
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                DebtorAccount:
                  type: object
                  additionalProperties: false
                  description: Provides the details to identify the debtor account.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level, as displayed by the ASPSP''s online channels.

                        Note, the account name is not the product name or the nickname of the account.'
                      example: Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - SchemeName
                CreditorAccount:
                  type: object
                  additionalProperties: false
                  description: Identification assigned by an institution to identify an account. This identification is known by the account owner.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level.

                        Note, the account name is not the product name or the nickname of the account.

                        OB: ASPSPs may carry out name validation for Confirmation of Payee, but it is not mandatory.'
                      example: Creditor Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - Name
                  - SchemeName
                UltimateCreditor:
                  $ref: '#/components/schemas/OBUltimateCreditor1'
                UltimateDebtor:
                  $ref: '#/components/schemas/OBUltimateDebtor1'
                RegulatoryReporting:
                  type: array
                  items:
                    $ref: '#/components/schemas/OBRegulatoryReporting1'
                  maxItems: 3
                  minItems: 0
                MandateRelatedInformation:
                  $ref: '#/components/schemas/OBMandateRelatedInformation1'
                SupplementaryData:
                  $ref: '#/components/schemas/OBSupplementaryData1'
              required:
              - CreditorAccount
              - FirstPaymentAmount
              - MandateRelatedInformation
            MultiAuthorisation:
              type: object
              additionalProperties: false
              description: The multiple authorisation flow response from the ASPSP.
              properties:
                Status:
                  type: string
                  description: Specifies the status of the authorisation flow in code form.
                  enum:
                  - AUTH
                  - AWAF
                  - RJCT
                NumberRequired:
                  type: integer
                  description: Number of authorisations required for payment order (total required at the start of the multi authorisation journey).
                  example: 42
                  maximum: 99999999
                  minimum: 0
                NumberReceived:
                  type: integer
                  description: Number of authorisations received.
                  example: 42
                  maximum: 99999999
                  minimum: 0
                LastUpdateDateTime:
                  type: string
                  format: date-time
                  description: "Last date and time at the authorisation flow was updated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                ExpirationDateTime:
                  type: string
                  format: date-time
                  description: "Date and time at which the requested authorisation flow must be completed. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
              required:
              - Status
            Debtor:
              $ref: '#/components/schemas/OBCashAccountDebtor4'
          required:
          - ConsentId
          - CreationDateTime
          - DomesticStandingOrderId
          - Initiation
          - Status
          - StatusUpdateDateTime
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      required:
      - Data
      nullable: false
    OBActiveCurrencyAndAmount_SimpleType:
      type: string
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      example: '1209.06'
      maxLength: 19
      minLength: 1
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
    PostBox:
      type: string
      description: Information that locates and identifies a box in a post office assigned to a person or organization, where letters for them are kept until called for.
      example: '42'
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,16})$
    SubDepartment:
      type: string
      description: Identification of a sub-division of a large organisation or building.
      example: string
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]){1,70}$
