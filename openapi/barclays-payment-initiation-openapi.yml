components:
  schemas:
    OBStatusReason:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        StatusReasonCode:
          type: string
          description: "Specifies the status reason in a code form. \nFor a full list of values refer to `OBExternalStatusReason1Code`\
            \ in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)"
          example: ERIN
          maxLength: 4
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,4})$
        StatusReasonDescription:
          type: string
          description: Description supporting the StatusReasonCode.
          example: description
          maxLength: 500
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9\-. '()£="_,&@#\/;&+]{1,500})$
        Path:
          type: string
          description: Path is optional but relevant when the status reason refers to an object/field and hence conditional
            to provide JSON path.
          example: path
          maxLength: 500
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,500})$
      nullable: false
    Meta:
      type: object
      additionalProperties: false
      deprecated: false
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          type: integer
          format: int32
          example: 10
          maximum: 999999
          minimum: 0
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      title: MetaData
      nullable: false
    CareOf:
      type: string
      description: The 'care of' address is used whenever sending mail to a person or organisation who does not actually live
        or work at the address. They will receive the mail for the individual.
      example: Arthur Dent
      maxLength: 140
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,140})$
    SubDepartment:
      type: string
      description: Identification of a sub-division of a large organisation or building.
      example: string
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]){1,70}$
    OBPaymentStatusReason:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        StatusReasonCode:
          type: string
          description: "Specifies the status reason in a code form \n For more information and enum values see `OBExternalStatusReason1Code\
            \ [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)"
          example: ERIN
          maxLength: 4
          minLength: 1
        StatusReasonDescription:
          type: string
          description: Description supporting the StatusReasonCode.
          maxLength: 500
          minLength: 1
        Path:
          type: string
          description: Recommended but optional reference to the JSON Path of the field with error, e.g., Data.Initiation.InstructedAmount.Currency
          maxLength: 500
          minLength: 1
      nullable: false
    PostBox:
      type: string
      description: Information that locates and identifies a box in a post office assigned to a person or organization, where
        letters for them are kept until called for.
      example: '42'
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,16})$
