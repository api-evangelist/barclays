  responses:
    200DomesticStandingOrderConsentsConsentIdRead:
      description: Domestic Standing Order Consents Read
      headers:
        x-fapi-interaction-id:
          description: An RFC4122 UID used as a correlation id.
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 36
            minLength: 32
            pattern: ^[A-Za-f0-9]{8}-?[A-Za-f0-9]{4}-?[1-5][A-Za-f0-9]{3}-?[89ab][A-Za-f0-9]{3}-?[A-Za-f0-9]{12}$
            nullable: false
          example: 93bac548-d2de-4546-b106-880a5018460d
        x-jws-signature:
          description: 'Header containing a detached JWS signature of the body of the payload.

            '
          required: true
          schema:
            type: string
            deprecated: false
            maxLength: 8192
            minLength: 10
            pattern: ^[A-Za-z0-9-_="\/.]{1,8192}$
            nullable: false
          example: V2hhdCBoYXRoIGdvZCB3cm91Z2h0ID8=..QnkgR2VvcmdlLCBzaGUncyBnb3QgaXQhIEJ5IEdlb3JnZSBzaGUncyBnb3QgaXQhIE5vdyBvbmNlIGFnYWluLCB3aGVyZSBkb2VzIGl0IHJhaW4
        Cache-Control:
          description: GIS mandatory response header. This is added by the Cognac sidecar.
          schema:
            type: string
            default: no-cache, no-store, must-revalidate
            deprecated: false
            maxLength: 35
            minLength: 35
            pattern: ^no-cache, no-store, must-revalidate$
            nullable: false
          example: no-cache, no-store, must-revalidate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OBWriteDomesticStandingOrderConsentResponse6'
          examples:
            get-dom-stand-order-con-response:
              value:
                Data:
                  ConsentId: BARCLAYS-P-12345678901234
                  CreationDateTime: '2024-09-04T18:17:23.786Z'
                  Status: AUTH
                  StatusUpdateDateTime: '2024-09-04T18:19:23.786Z'
                  Permission: Create
                  ReadRefundAccount: 'No'
                  Charges:
                  - ChargeBearer: BorneByCreditor
                    Type: UK.OBIE.CHAPSOut
                    Amount:
                      Amount: '0.50'
                      Currency: GBP
                  Initiation:
                    RemittanceInformation:
                      Structured:
                      - ReferredDocumentInformation:
                        - Code: CINV
