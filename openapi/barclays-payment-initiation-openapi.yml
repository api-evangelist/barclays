                    of the debtor's account.
                  example: GBP
                  maxLength: 3
                  minLength: 3
                  pattern: ^[A-Z]{3,3}$
                DestinationCountryCode:
                  type: string
                  description: Country in which Credit Account is domiciled. Code to identify a country, a dependency, or
                    another area of particular geopolitical interest, on the basis of country names obtained from the United
                    Nations (ISO 3166, Alpha-2 code).
                  example: GB
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]{2,2}$
                InstructedAmount:
                  type: object
                  additionalProperties: false
                  description: 'Amount of money to be moved between the debtor and creditor, before deduction of charges,
                    expressed in the currency as ordered by the initiating party.

                    Usage: This amount has to be transported unchanged through the transaction chain.'
