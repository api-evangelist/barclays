          example: 1800Flowers
          maxLength: 25
          minLength: 1
          pattern: ^[a-zA-Z0-9 '*@]{1,25}$
        dateAuth:
          type: string
          format: date
          deprecated: false
          description: It represents transaction Date
          example: '2012-03-22'
        authType:
          type: string
          description: Authorization Type which will hold values like PURCHASE/CASH/PAYMENT/...
          enum:
          - PURCHASE
          - CASH_NON_ATM
          - CASH_ATM
          - BALANCE_INQUIRY
          - MAIL_OR_PHONE_ORDER
          - MERCHANT_RETURN
          - PAYMENT
          - CHECK_GUARENTEE
          - CASH_BALANCE_TRANSFER
          - CONVENIENCE_CHECK
          - PURCHASE_BALANCE_TRANSFER
          - FAST_CASH
          - WITHHOLD_FROM_AVAILABLE
          - PIN_UNBLOCK
          - PIN_CHANGE
          - BANKCARD_DEPOSIT_ACCOUNT
          - FACP
          - BILL_PAYMENT
          - PIN_VERIFICATION
          - TRIAD_HOLD_PAY
          - PROBE_HOLD_PAY
          - ACCESS_FUNDS_TRANSFER
          - IBAN_AUTHORIZATION
          - MINI_STATEMENT
          - MOBILE_TOP_UP
          - ACCOUNT_VERIFICATION
          - TOKEN_ELIGIBILITY_REQUEST
          - TOKEN_PROVISION_REQUEST
          - TOKEN_AUTH_REQUEST
          - TOKEN_PROVISION_COMPLETED
          - TOKEN_LOCK_REQUEST
          - TOKEN_UNLOCK_REQUEST
          - TOKEN_DELETE_REQUEST
          - NIL
          example: TOKEN_LOCK_REQUEST
        amount:
          $ref: '#/components/schemas/Amount'
        resp:
          type: string
          description: Authorization Response whether it's approved or declined
          enum:
          - APPROVED
          - DECLINED
          - FRAUD
          - PICKUP
          - REFER
          - NIL
          example: REFER
        status:
          type: string
          description: It represents transaction status like MATCHED/ AMOUNT_INCLUDED /AMOUNT_NOT_INCLUDED/..
          enum:
          - MATCHED
          - AMOUNT_INCLUDED
          - AMOUNT_NOT_INCLUDED
          - REAL_TIME_AUTHORIZATION
          - REVERSED_AUTHORIZATION
          - PAY
          - NIL
          example: PAY
      nullable: false
    customerFirstOrLastName:
      type: string
      deprecated: false
      description: Customer first or last name
      example: John
      maxLength: 30
      minLength: 1
      pattern: ^[a-zA-Z']{1,30}$
    TransactionsListV2:
