        type: number
        maxLength: 16
        minLength: 15
        pattern: ^[0-9]{15,16}$
      example: 001346780132564
    Content-Type:
      name: Content-Type
      in: header
      description: Content-Type
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 35
        minLength: 16
        pattern: ^[a-z0-9A-Z\-\/\;\=\ ]{16,35}$
      example: application/json
