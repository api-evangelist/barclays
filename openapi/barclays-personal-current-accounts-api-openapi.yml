openapi: 3.2.0
info:
  title: Product Details Personal Current Accounts API
  description: The Barclays Product Details API allows users to discover various financial products Barclays offers. From personal accounts to SME lending products, business current accounts to commercial credit cards, users can view current product details.
  version: '2.4'
tags:
- name: Personal Current Accounts
paths:
  /personal-current-accounts:
    get:
      description: Lists all Barclays Personal Account products
      operationId: get_personal-current-accounts
      parameters:
      - name: If-Modified-Since
        in: header
        description: Used for conditional request, to retrieve data only if modified since a given date.
        required: false
        schema:
          type: string
          description: Used for conditional request, to retrieve data only if modified since a given date.
          pattern: ^(?!\s)(Mon|Tue|Wed|Thu|Fri|Sat|Sun){1}, (\d){2} (Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec){1} (\d){4} (\d){2}:(\d){2}:(\d){2} GMT$
      - name: If-None-Match
        in: header
        description: Used for conditional request, to retrieve data only if the given Etag value does not match.
        required: false
        schema:
          type: string
          description: Used for conditional request, to retrieve data only if the given Etag value does not match.
          pattern: ^(?!\\s)([a-zA-Z0-9,\/"* ]{1,500})$
      responses:
        '200':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/personal_account_response'
              example: null
        '400':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/HeadUnsecuredSmeLoans400Response'
              example: null
        '500':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/HeadUnsecuredSmeLoans500Response'
              example: null
        '503':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/HeadUnsecuredSmeLoans503Response'
              example: null
        '429':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/HeadUnsecuredSmeLoans429Response'
              example: null
        '408':
          description: ''
          content:
            application/prs.openbanking.opendata.v2.2+json:
              schema:
                $ref: '#/components/schemas/HeadUnsecuredSmeLoans408Response'
              example: null
      tags:
      - Personal Current Accounts
      summary: Get personal current accounts
      x-summary-source: derived
    head:
      description: Gets header information on Personal Current Accounts objects.
      operationId: head_personal-current-accounts
      parameters:
      - name: If-Modified-Since
        in: header
        description: Used for conditional request, to retrieve data only if modified since a given date.
