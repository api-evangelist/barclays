    OBWriteInternationalScheduledConsent5:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Data:
          type: object
          additionalProperties: false
          properties:
            Permission:
              type: string
              description: Specifies the Open Banking service request types.
              enum:
              - Create
            ReadRefundAccount:
              type: string
              description: Specifies to share the refund account details with PISP
              enum:
              - 'No'
              - 'Yes'
            Initiation:
              type: object
              additionalProperties: false
              description: The Initiation payload is sent by the initiating party to the ASPSP. It is used to request movement of funds from the debtor account to a creditor for a single scheduled international payment.
              properties:
                InstructionIdentification:
                  type: string
                  description: 'Unique identification as assigned by an instructing party for an instructed party to unambiguously identify the instruction.

                    Usage: the  instruction identification is a point to point reference that can be used between the instructing party and the instructed party to refer to the individual instruction. It can be included in several messages related to the instruction.'
                  example: ANSM023
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9\-. '()£="_]{1,35})$
                EndToEndIdentification:
                  type: string
                  description: 'Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.

                    Usage: The end-to-end identification can be used for reconciliation or to link tasks relating to the transaction. It can be included in several messages related to the transaction.

                    OB: The Faster Payments Scheme can only access 31 characters for the EndToEndIdentification field.'
                  example: FRESCO
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_]{1,35})$
                LocalInstrument:
                  $ref: '#/components/schemas/OBInternalLocalInstrument1Code'
                InstructionPriority:
                  type: string
                  description: Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction.
                  enum:
                  - Normal
                  - Urgent
                ExtendedPurpose:
                  type: string
                  description: Specifies the purpose of an international payment, when there is no corresponding 4 character code available in the ISO20022 list of Purpose Codes.
                  example: string
                  maxLength: 140
                  minLength: 1
                  pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,140})$
                ChargeBearer:
                  $ref: '#/components/schemas/OBInternalChargeBearerType1Code'
                RequestedExecutionDateTime:
                  type: string
                  format: date-time
                  description: "Date at which the initiating party requests the clearing agent to process the payment. \nUsage: This is the date on which the debtor's account is to be debited. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                CurrencyOfTransfer:
                  type: string
                  description: Specifies the currency of the to be transferred amount, which is different from the currency of the debtor's account.
                  example: GBP
                  maxLength: 3
                  minLength: 3
                  pattern: ^[A-Z]{3,3}$
                DestinationCountryCode:
                  type: string
                  description: Country in which Credit Account is domiciled. Code to identify a country, a dependency, or another area of particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166, Alpha-2 code).
                  example: GB
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]{2,2}$
                InstructedAmount:
                  type: object
                  additionalProperties: false
                  description: 'Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.

                    Usage: This amount has to be transported unchanged through the transaction chain.'
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                ExchangeRateInformation:
                  type: object
                  additionalProperties: false
                  description: Provides details on the currency exchange rate and contract.
                  properties:
                    UnitCurrency:
                      type: string
                      description: Currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
                      example: GBP
                      maxLength: 3
                      minLength: 3
                      pattern: ^[A-Z]{3,3}$
                    ExchangeRate:
                      type: number
                      description: The factor used for conversion of an amount from one currency to another. This reflects the price at which one currency was bought with another currency.
                      example: 0
                      maximum: 99999999
                      minimum: 0
                    RateType:
                      type: string
                      description: Specifies the type used to complete the currency exchange.
                      enum:
                      - Actual
                      - Agreed
                      - Indicative
                    ContractIdentification:
                      type: string
                      description: Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/creditor and the debtor agent.
                      example: Contract Info
                      maxLength: 256
                      minLength: 1
                      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,256})$
                  required:
                  - RateType
                  - UnitCurrency
                DebtorAccount:
                  type: object
                  additionalProperties: false
                  description: Unambiguous identification of the account of the debtor to which a debit entry will be made as a result of the transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level, as displayed by the ASPSP''s online channels.

                        Note, the account name is not the product name or the nickname of the account.'
                      example: Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - SchemeName
                Creditor:
                  type: object
                  additionalProperties: false
                  description: Party to which an amount of money is due.
                  properties:
                    Name:
                      type: string
                      description: Name by which a party is known and which is usually used to identify that party.
                      example: Name
                      maxLength: 140
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,140})$
                    LEI:
                      $ref: '#/components/schemas/LEI'
                    PostalAddress:
                      $ref: '#/components/schemas/OBPostalAddress7'
                CreditorAgent:
                  type: object
                  additionalProperties: false
                  description: Financial institution servicing an account for the creditor.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalFinancialInstitutionIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_1'
                    LEI:
                      $ref: '#/components/schemas/LEI'
                    Name:
                      $ref: '#/components/schemas/Name'
                    PostalAddress:
                      $ref: '#/components/schemas/OBPostalAddress7'
                CreditorAccount:
                  type: object
                  additionalProperties: false
                  description: Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level.

                        Note, the account name is not the product name or the nickname of the account.

                        OB: ASPSPs may carry out name validation for Confirmation of Payee, but it is not mandatory.'
                      example: Creditor Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - Name
                  - SchemeName
                UltimateCreditor:
                  $ref: '#/components/schemas/OBUltimateCreditor1'
                UltimateDebtor:
                  $ref: '#/components/schemas/OBUltimateDebtor1'
                RegulatoryReporting:
                  type: array
                  items:
                    $ref: '#/components/schemas/OBRegulatoryReporting1'
                  maxItems: 3
                  minItems: 0
                RemittanceInformation:
                  $ref: '#/components/schemas/OBRemittanceInformation2'
                SupplementaryData:
                  $ref: '#/components/schemas/OBSupplementaryData1'
              required:
              - CreditorAccount
              - CurrencyOfTransfer
              - InstructedAmount
              - InstructionIdentification
              - RequestedExecutionDateTime
            Authorisation:
              type: object
              additionalProperties: false
              description: The authorisation type request from the TPP.
              properties:
                AuthorisationType:
                  type: string
                  description: Type of authorisation flow requested.
                  enum:
                  - Any
                  - Single
                CompletionDateTime:
                  type: string
                  format: date-time
                  description: "Date and time at which the requested authorisation flow must be completed. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
              required:
              - AuthorisationType
            SCASupportData:
              $ref: '#/components/schemas/OBSCASupportData1'
          required:
          - Initiation
          - Permission
        Risk:
          $ref: '#/components/schemas/OBRisk1'
      required:
      - Data
      - Risk
      nullable: false
