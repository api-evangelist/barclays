components:
  schemas:
    OBWriteFundsConfirmationResponse1:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Data:
          type: object
          additionalProperties: false
          properties:
            FundsAvailableResult:
              type: object
              additionalProperties: false
              description: Result of a funds availability check.
              properties:
                FundsAvailableDateTime:
                  type: string
                  format: date-time
                  description: "Date and time at which the funds availability check was generated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                FundsAvailable:
                  type: boolean
                  description: Flag to indicate the availability of funds given the Amount in the consent request.
              required:
              - FundsAvailable
              - FundsAvailableDateTime
            SupplementaryData:
              $ref: '#/components/schemas/OBSupplementaryData1'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      required:
      - Data
      nullable: false
    OBActiveCurrencyAndAmount_SimpleType:
      type: string
      description: A number of monetary units specified in an active currency where the unit of currency is explicit and compliant with ISO 4217.
      example: '1209.06'
      maxLength: 19
      minLength: 1
      pattern: ^\d{1,13}$|^\d{1,13}\.\d{1,5}$
    PostBox:
      type: string
      description: Information that locates and identifies a box in a post office assigned to a person or organization, where letters for them are kept until called for.
      example: '42'
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,16})$
    SubDepartment:
      type: string
      description: Identification of a sub-division of a large organisation or building.
      example: string
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]){1,70}$
    Identification_4:
      type: string
      description: Identification of the party to whom an invoice is issued, when it is different from the debtor or ultimate debtor.
      example: '80200112344562'
      maxLength: 256
      minLength: 1
      pattern: ^[a-zA-Z0-9]{1,256}$
    OBRegulatoryReporting1:
      type: object
      additionalProperties: false
      deprecated: false
      description: Information needed due to regulatory and statutory requirements
      properties:
        DebitCreditReportingIndicator:
          type: string
          description: Identifies whether the regulatory reporting information applies to the debit side, to the credit side or to both debit and credit sides of the transaction.  For a full list of values reefer to `OBExternalRegulatoryReportingType1Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
          enum:
          - CRED
          - DEBT
          - BOTH
        Authority:
          $ref: '#/components/schemas/OBRegulatoryAuthority2'
        Details:
          type: array
          items:
            $ref: '#/components/schemas/OBStructuredRegulatoryReporting3'
          maxItems: 3
          minItems: 1
      nullable: false
    Identification_1:
      type: string
      description: Unique and unambiguous identification of a financial institution or a branch of a financial institution.
      example: '10210393826475'
      maxLength: 35
      minLength: 1
      pattern: ^[a-zA-Z0-9]{1,35}$
    OBActiveOrHistoricCurrencyAndAmount:
      type: object
      additionalProperties: false
      deprecated: false
      description: Amount of money associated with the charge type.
      properties:
        Amount:
          $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
        Currency:
          $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
      required:
      - Amount
      - Currency
      nullable: false
    OBProxy1:
      type: object
      additionalProperties: false
      deprecated: false
      description: Specifies an alternate assumed name for the identification of the account.
      properties:
        Identification:
          type: string
          description: Identification used to indicate the account identification under another specified name.
          example: 08080021325698
          maxLength: 2048
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,2048})$
        Code:
          $ref: '#/components/schemas/ExternalProxyAccountType1Code'
        Type:
          type: string
          description: Type of the proxy identification.
          example: Telephone
          maxLength: 35
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,35})$
      required:
      - Code
      - Identification
      nullable: false
    Meta:
      type: object
      additionalProperties: false
      deprecated: false
      description: Meta Data relevant to the payload
      properties:
        TotalPages:
          type: integer
          format: int32
          example: 10
          maximum: 999999
          minimum: 0
        FirstAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
        LastAvailableDateTime:
          $ref: '#/components/schemas/ISODateTime'
      title: MetaData
      nullable: false
    ExternalPaymentTransactionStatus2Code:
      type: string
      description: "Specifies the status of the payment order resource. \n\nFor a full list of values see `ExternalPaymentTransactionStatus2Code` in *OB_Internal_CodeSet* \n[here](https://github.com/OpenBankingUK/External_Internal_CodeSets)\n"
      enum:
      - CANC
      - RCVD
      - PDNG
      - ACTC
      - PATC
      - ACCP
      - ACFC
      - ACSP
      - ACWC
      - ACSC
      - BLCK
      - ACCC
      - ACWP
      - RJCT
    Links:
      type: object
      additionalProperties: false
      deprecated: false
      description: Links relevant to the payload
      properties:
        Self:
          type: string
          format: uri
        First:
          type: string
          format: uri
        Prev:
          type: string
          format: uri
        Next:
          type: string
          format: uri
        Last:
          type: string
          format: uri
      required:
      - Self
      nullable: false
    OBUltimateCreditor1:
      type: object
      additionalProperties: false
      description: Ultimate party to which an amount of money is due.
      properties:
        Name:
          type: string
          description: Name by which a party is known and which is usually used to identify that party.
          example: Arthur Dent
          maxLength: 140
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,140})$
        Identification:
          type: string
          description: Identification assigned by an institution.
          example: '1234567890'
          maxLength: 256
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,256})$
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
        PostalAddress:
          $ref: '#/components/schemas/OBPostalAddress7'
    PostCode:
      type: string
      description: Identifier consisting of a group of letters and/or numbers that is added to a postal address to assist the sorting of mail.
      example: ST15 8WD
      maxLength: 16
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9 ]){1,16}$
    OBWriteInternationalScheduledResponse6:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Data:
          type: object
          additionalProperties: false
          properties:
            InternationalScheduledPaymentId:
              type: string
              description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the international scheduled payment resource.'
              maxLength: 40
              minLength: 1
            ConsentId:
              type: string
              description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the consent resource.'
              example: BARCLAYS-P-12345678901234
              maxLength: 25
              minLength: 1
              pattern: ^BARCLAYS-P-\d{14}$
            CreationDateTime:
              type: string
              format: date-time
              description: "Date and time at which the message was created. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            Status:
              $ref: '#/components/schemas/ExternalPaymentTransactionStatus2Code'
            StatusUpdateDateTime:
              type: string
              format: date-time
              description: "Date and time at which the resource status was updated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            StatusReason:
              type: array
              items:
                $ref: '#/components/schemas/OBStatusReason'
              maxItems: 99999
              minItems: 0
            ExpectedExecutionDateTime:
              type: string
              format: date-time
              description: "Expected execution date and time for the payment resource. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            ExpectedSettlementDateTime:
              type: string
              format: date-time
              description: "Expected settlement date and time for the payment resource. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            Refund:
              $ref: '#/components/schemas/OBDomesticRefundAccount1'
            Charges:
              type: array
              items:
                type: object
                additionalProperties: false
                description: Set of elements used to provide details of a charge for the payment initiation.
                properties:
                  ChargeBearer:
                    $ref: '#/components/schemas/OBInternalChargeBearerType1Code'
                  Type:
                    $ref: '#/components/schemas/OBInternalPaymentChargeType1Code'
                  Amount:
                    $ref: '#/components/schemas/OBActiveOrHistoricCurrencyAndAmount'
                required:
                - Amount
                - ChargeBearer
                - Type
              maxItems: 99999
              minItems: 0
            ExchangeRateInformation:
              type: object
              additionalProperties: false
              description: Further detailed information on the exchange rate that has been used in the payment transaction.
              properties:
                UnitCurrency:
                  type: string
                  description: Currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
                  example: GBP
                  maxLength: 3
                  minLength: 3
                  pattern: ^[A-Z]{3,3}$
                ExchangeRate:
                  type: number
                  description: The factor used for conversion of an amount from one currency to another. This reflects the price at which one currency was bought with another currency.
                  example: 0
                  maximum: 99999999
                  minimum: 0
                RateType:
                  type: string
                  description: Specifies the type used to complete the currency exchange.
                  enum:
                  - Actual
                  - Agreed
                  - Indicative
                ContractIdentification:
                  type: string
                  description: Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/creditor and the debtor agent.
                  example: Contract Info
                  maxLength: 256
                  minLength: 1
                  pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,256})$
                ExpirationDateTime:
                  type: string
                  format: date-time
                  description: "Specified date and time the exchange rate agreement will expire. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
              required:
              - ExchangeRate
              - RateType
              - UnitCurrency
            Initiation:
              type: object
              additionalProperties: false
              description: The Initiation payload is sent by the initiating party to the ASPSP. It is used to request movement of funds from the debtor account to a creditor for a single scheduled international payment.
              properties:
                InstructionIdentification:
                  type: string
                  description: 'Unique identification as assigned by an instructing party for an instructed party to unambiguously identify the instruction.

                    Usage: the  instruction identification is a point to point reference that can be used between the instructing party and the instructed party to refer to the individual instruction. It can be included in several messages related to the instruction.'
                  example: ANSM023
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9\-. '()£="_]{1,35})$
                EndToEndIdentification:
                  type: string
                  description: 'Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.

                    Usage: The end-to-end identification can be used for reconciliation or to link tasks relating to the transaction. It can be included in several messages related to the transaction.

                    OB: The Faster Payments Scheme can only access 31 characters for the EndToEndIdentification field.'
                  example: FRESCO
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_]{1,35})$
                LocalInstrument:
                  $ref: '#/components/schemas/OBInternalLocalInstrument1Code'
                InstructionPriority:
                  type: string
                  description: Indicator of the urgency or order of importance that the instructing party would like the instructed party to apply to the processing of the instruction.
                  enum:
                  - Normal
                  - Urgent
                ExtendedPurpose:
                  type: string
                  description: Specifies the purpose of an international payment, when there is no corresponding 4 character code available in the ISO20022 list of Purpose Codes.
                  example: string
                  maxLength: 140
                  minLength: 1
                  pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_\-]{1,140})$
                ChargeBearer:
                  $ref: '#/components/schemas/OBInternalChargeBearerType1Code'
                RequestedExecutionDateTime:
                  type: string
                  format: date-time
                  description: "Date at which the initiating party requests the clearing agent to process the payment. \nUsage: This is the date on which the debtor's account is to be debited. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                CurrencyOfTransfer:
                  type: string
                  description: Specifies the currency of the to be transferred amount, which is different from the currency of the debtor's account.
                  example: GBP
                  maxLength: 3
                  minLength: 3
                  pattern: ^[A-Z]{3,3}$
                DestinationCountryCode:
                  type: string
                  description: Country in which Credit Account is domiciled. Code to identify a country, a dependency, or another area of particular geopolitical interest, on the basis of country names obtained from the United Nations (ISO 3166, Alpha-2 code).
                  example: GB
                  maxLength: 2
                  minLength: 2
                  pattern: ^[A-Z]{2,2}$
                InstructedAmount:
                  type: object
                  additionalProperties: false
                  description: 'Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.

                    Usage: This amount has to be transported unchanged through the transaction chain.'
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                ExchangeRateInformation:
                  type: object
                  additionalProperties: false
                  description: Provides details on the currency exchange rate and contract.
                  properties:
                    UnitCurrency:
                      type: string
                      description: Currency in which the rate of exchange is expressed in a currency exchange. In the example 1GBP = xxxCUR, the unit currency is GBP.
                      example: GBP
                      maxLength: 3
                      minLength: 3
                      pattern: ^[A-Z]{3,3}$
                    ExchangeRate:
                      type: number
                      description: The factor used for conversion of an amount from one currency to another. This reflects the price at which one currency was bought with another currency.
                      example: 0
                      maximum: 99999999
                      minimum: 0
                    RateType:
                      type: string
                      description: Specifies the type used to complete the currency exchange.
                      enum:
                      - Actual
                      - Agreed
                      - Indicative
                    ContractIdentification:
                      type: string
                      description: Unique and unambiguous reference to the foreign exchange contract agreed between the initiating party/creditor and the debtor agent.
                      example: Contract Info
                      maxLength: 256
                      minLength: 1
                      pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,256})$
                  required:
                  - RateType
                  - UnitCurrency
                DebtorAccount:
                  type: object
                  additionalProperties: false
                  description: Unambiguous identification of the account of the debtor to which a debit entry will be made as a result of the transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level, as displayed by the ASPSP''s online channels.

                        Note, the account name is not the product name or the nickname of the account.'
                      example: Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - SchemeName
                Creditor:
                  type: object
                  additionalProperties: false
                  description: Party to which an amount of money is due.
                  properties:
                    Name:
                      type: string
                      description: Name by which a party is known and which is usually used to identify that party.
                      example: Name
                      maxLength: 140
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,140})$
                    LEI:
                      $ref: '#/components/schemas/LEI'
                    PostalAddress:
                      $ref: '#/components/schemas/OBPostalAddress7'
                CreditorAgent:
                  type: object
                  additionalProperties: false
                  description: Financial institution servicing an account for the creditor.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalFinancialInstitutionIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_1'
                    LEI:
                      $ref: '#/components/schemas/LEI'
                    Name:
                      $ref: '#/components/schemas/Name'
                    PostalAddress:
                      $ref: '#/components/schemas/OBPostalAddress7'
                CreditorAccount:
                  type: object
                  additionalProperties: false
                  description: Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level.

                        Note, the account name is not the product name or the nickname of the account.

                        OB: ASPSPs may carry out name validation for Confirmation of Payee, but it is not mandatory.'
                      example: Creditor Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - Name
                  - SchemeName
                UltimateCreditor:
                  $ref: '#/components/schemas/OBUltimateCreditor1'
                UltimateDebtor:
                  $ref: '#/components/schemas/OBUltimateDebtor1'
                RegulatoryReporting:
                  type: array
                  items:
                    $ref: '#/components/schemas/OBRegulatoryReporting1'
                  maxItems: 3
                  minItems: 0
                RemittanceInformation:
                  $ref: '#/components/schemas/OBRemittanceInformation2'
                SupplementaryData:
                  $ref: '#/components/schemas/OBSupplementaryData1'
              required:
              - CreditorAccount
              - CurrencyOfTransfer
              - InstructedAmount
              - InstructionIdentification
              - RequestedExecutionDateTime
            MultiAuthorisation:
              type: object
              additionalProperties: false
              description: The multiple authorisation flow response from the ASPSP.
              properties:
                Status:
                  type: string
                  description: Specifies the status of the authorisation flow in code form.
                  enum:
                  - AUTH
                  - AWAF
                  - RJCT
                NumberRequired:
                  type: integer
                  description: Number of authorisations required for payment order (total required at the start of the multi authorisation journey).
                  example: 42
                  maximum: 99999999
                  minimum: 0
                NumberReceived:
                  type: integer
                  description: Number of authorisations received.
                  example: 42
                  maximum: 99999999
                  minimum: 0
                LastUpdateDateTime:
                  type: string
                  format: date-time
                  description: "Last date and time at the authorisation flow was updated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                ExpirationDateTime:
                  type: string
                  format: date-time
                  description: "Date and time at which the requested authorisation flow must be completed. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
              required:
              - Status
            Debtor:
              $ref: '#/components/schemas/OBCashAccountDebtor4'
          required:
          - ConsentId
          - CreationDateTime
          - Initiation
          - InternationalScheduledPaymentId
          - Status
          - StatusUpdateDateTime
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      required:
      - Data
      nullable: false
    TownName:
      type: string
      description: Name of a built-up area, with defined boundaries, and a local government.
      example: Burslem
      maxLength: 35
