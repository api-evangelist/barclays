                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_]{1,35})$
                LocalInstrument:
                  $ref: '#/components/schemas/OBInternalLocalInstrument1Code'
                InstructionPriority:
                  type: string
