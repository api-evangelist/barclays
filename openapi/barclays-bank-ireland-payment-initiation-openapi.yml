    get_payment-status_response:
      type: object
      description: Get Payment Status
      properties:
        transactionStatus:
          type: string
          description: 'The transaction status is filled with codes of the ISO 20022 data table. Valid status values are:


            - ACCP: AcceptedCustomerProfile Preceding check of technical validation was successful.Customer profile check
            was also successful.

            - ACSP: AcceptedSettlementInProcess All preceding checks such as technical validation and customer profile were
            successful and therefore the payment initiation has been accepted for execution.

            - PDNG: Pending Payment initiation or individual transaction included in the payment initiation is pending. Further
            checks and status update will be performed.

            - RJCT: Rejected Payment initiation or individual transaction included in the payment initiation has been rejected.

            - CANC: Cancelled Payment initiation has been cancelled before execution. Remark Change Request to ISO20022 is
            still needed.

            '
          enum:
          - ACCP
          - ACSP
          - PDNG
          - RJCT
          - CANC
      required:
      - transactionStatus
