components:
  schemas:
    OBStatusReason:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        StatusReasonCode:
          type: string
          description: "Specifies the status reason in a code form. \nFor a full list of values refer to `OBExternalStatusReason1Code`\
            \ in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)"
          example: ERIN
          maxLength: 4
          minLength: 1
        StatusReasonDescription:
          type: string
          description: Description supporting the StatusReasonCode.
          maxLength: 500
          minLength: 1
        Path:
          type: string
          description: Recommended but optional reference to the JSON Path of the field with error, e.g., Data.Initiation.InstructedAmount.Currency
          maxLength: 500
          minLength: 1
      nullable: false
    OBUltimateDebtor1:
      type: object
      additionalProperties: false
      description: Ultimate party that owes an amount of money to the (ultimate) creditor.
      properties:
        Name:
          type: string
          description: Name by which a party is known and which is usually used to identify that party.
          example: James Bond
          maxLength: 140
          minLength: 1
          pattern: ^(?!\s)([A-Za-z0-9!+\/\= '.,@#()_-]{1,140})$
        Identification:
          type: string
          description: Identification assigned by an institution.
          example: SC112800
          maxLength: 256
          minLength: 1
          pattern: ^(?!\s)([a-zA-Z0-9-. '_]{1,256})$
        LEI:
          $ref: '#/components/schemas/LEI'
        SchemeName:
          $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
        PostalAddress:
          $ref: '#/components/schemas/OBPostalAddress7'
    StreetName:
      type: string
      description: Name of a street or thoroughfare.
      example: 21 Aston Street
      maxLength: 70
      minLength: 1
      pattern: ^(?!\s)([a-zA-Z0-9- '.,\/]{1,70})$
    Meta:
      type: object
      description: Meta Data relevant to the payload. At present no fields are used for VRP.
