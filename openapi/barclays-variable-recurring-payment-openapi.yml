        nullable: false
      example: 104.25.212.99
    DomesticVRPId:
      name: domesticVRPId
      in: path
      description: This will be unique sweeping payment identifier returned for this payment initiation request from the TPP.
        In Barclays, the format will be BARCLAYS-S-nnnnnnnnnnnnnn-xxxxxxxxxxxxxx where S means a sweeping payment request
        consent, nnnnnnnnnnnnnn and xxxxxxxxxxxxxx are14 digit numbers.
      required: true
      schema:
        type: string
        deprecated: false
        maxLength: 40
        minLength: 40
        pattern: ^BARCLAYS-S-\d{14}\-\d{14}$
        nullable: false
      example: BARCLAYS-S-12345678901234-12345678901234
    x-idempotency-key:
      name: x-idempotency-key
      in: header
      description: 'Every request will be processed only once per x-idempotency-key.  The

        Idempotency Key will be valid for 24 hours.

        '
      required: true
      schema:
        type: string
        deprecated: false
        maxLength: 40
        minLength: 1
        pattern: ^(?!\s)([a-zA-Z0-9-. '()@#£%{}=":_]{1,40})$
        nullable: false
      example: FRESNO.1317.GFX.22
    ConsentId:
      name: consentId
      in: path
      description: ConsentId
      required: true
      schema:
        type: string
        deprecated: false
        maxLength: 25
        minLength: 1
        pattern: ^BARCLAYS-S-\d{14}$
        nullable: false
      example: BARCLAYS-S-12345678901234
