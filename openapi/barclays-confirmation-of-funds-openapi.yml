                  example: '12345678901234'
                  maxLength: 256
                  minLength: 1
                  pattern: ^\d{14}$|^[A-Z]{2}\d{2}[A-Z0-9]{1,30}$|^\d{16}$
                Name:
                  type: string
                  description: 'Name of the account, as assigned by the account servicing institution.

