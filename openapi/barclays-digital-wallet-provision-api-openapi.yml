openapi: 3.2.0
info:
  title: Digital Wallet Provision API
  description: Offers a convenient way to provision cards to digital wallets securely
  version: '2.0'
tags:
- name: Digital Wallet Provision
  description: Provisions credit cards to digital wallets with eligibility verification and fraud assessment
paths:
  /cards/accounts/{accountId}/wallet-provision:
    summary: Provision digital wallet for credit card account
    description: Provisions a credit card to a digital wallet with eligibility verification and fraud assessment
    post:
      tags:
      - Digital Wallet Provision
      summary: Provision card to digital wallet
      description: 'Provisions a credit card to a digital wallet on the customer''s device. This endpoint handles eligibility verification, fraud assessment, and wallet provisioning.


        **Business Flow:**

        1. Validates account and customer eligibility for wallet provisioning

        2. Performs fraud risk assessment based on account status and risk rules

        3. Provisions card to the specified wallet (Apple Pay, Google Pay, or Samsung Pay)

        4. Returns provisioning data including activation tokens and encrypted pass data


        **Supported Wallets:**

        - **Apple Pay** (walletId: 103) - iOS devices

        - **Google Pay** (walletId: 216) - Android devices

        - **Samsung Pay** (walletId: 217) - Samsung devices


        **Request Requirements:**


        **For Apple Pay:**

        - Device certificates (leaf certificate, sub-certificate)

        - Nonce and nonce signature from Apple SDK

        - Device name and OS version


        **For Google Pay:**

        - Device name and OS version

        - Client wallet account ID (required for VISA cards)

        - Client device ID (required for VISA cards)


        **For Samsung Pay:**

        - Device name and OS version


        **Response Structure:**


        **Apple Pay Response Contains:**

        - `encryptedPassData` - Encrypted wallet pass data for Apple Wallet

        - `ephemeralPublicKey` - Ephemeral public key for encryption

        - `activationData` - Cryptographic OTP for wallet activation


        **Google Pay Response Contains:**

        - `activationData` - Cryptographic OTP for wallet activation

        - `phone` - Customer phone number

        - `customerAddress` - Customer billing address (required by Google Pay)


        **Samsung Pay Response Contains:**

        - `activationData` - Cryptographic OTP for wallet activation


        **Use Cases:**

        - Customer adds card to Apple Wallet from mobile banking app

        - Partner app provisions card to Google Pay during account opening

        - Customer re-enrolls card after getting a new phone

        - Customer adds card to Samsung Pay from partner app


        **Error Scenarios:**

        - 400 Bad Request: Invalid request payload or missing required fields

        - 401 Unauthorized: Invalid or missing authentication token

        - 403 Forbidden: Account not eligible for wallet provisioning (e.g., account closed, fraud rules)

        - 404 Not Found: Account or customer not found

        - 428 Precondition Required: Additional fraud verification required (step-up authentication needed)

        - 500 Internal Server Error: System error during provisioning

        - 503 Service Unavailable: Wallet service temporarily unavailable'
      operationId: provisionWallet
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 35
          minLength: 16
          pattern: ^[a-z0-9A-Z\/ ]{16,35}$
        example: application/json
      - name: Correlation-ID
        in: header
        description: "Unique end-to-end trace ID. The initiating system (such as a Channel or \nBatch Job), must generate this unique ID, then this must be passed \nthrough the API call stack. This is required to maintain compliance with the current Barclays REST Standard."
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 7d444840-9dc0-11d1-b245-5ffdce74fad2
      - name: accountId
        in: path
        description: External Account Id
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        example: c8de699e-ff6d-11eb-9a03-0242ac130003
      - name: Authorization
        in: header
        description: TIAA-US External token
        required: true
        deprecated: false
        schema:
          type: string
        example: Bearer <token>
      requestBody:
        description: Wallet provision request containing eligibility criteria and device provisioning information
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletProvisionRequestData'
            examples:
              apple-pay-provision:
                summary: Apple Pay provisioning
                description: Provision card to Apple Wallet on iOS device
                value:
                  data:
                    walletId: '103'
                    eligibility:
                      enrollmentIndicator: NEW
                      sourceChannel: BCUS_Mobile
                    provision:
                      leafCertificate: MIID/TCCA6OgAwIBAgIIbFjYdyLBY/YwCgYIKoZIzj0EAwIwgYAxNDAyBgNVBAMMK0FwcGxlIFdvcmxkd2lkZSBEZXZlbG9wZXIgUmVsYXRpb25zIENBIC0gRzIxJjAkBgNVBAsMHUFwcGxlIENlcnRpZmljYXRpb24gQXV0aG9yaXR5MRMwEQYDVQ
                      nonceId: devhVQ==
                      nonceSignature: QOoKygfavhdWmyTJrSq4UoOA+miEdIEe4JXHga5eTyK+vv7DvfDJXDbvcyewQhD+f9o4FOmj3Gy0r9FmxIga+Jc3HtJP98wJf0efAT7BPSmj
                      subCertificate: MIIC9zCCAnygAwIBAgIIb+/Y9emjp+4wCgYIKoZIzj0EAwIwZzEbMBkGA1UEAwwSQXBwbGUgUm9vdCBDQSAtIEczMSYwJAYDVQQLDB1BcHBsZSBDZXJ0aWZpY2F0aW9uIEF1dGhvcml0eT
                      deviceName: iPhone 14 Pro
                      osName: IOS
                      osVersion: 17.2.1
              google-pay-mastercard:
                summary: Google Pay - Mastercard
                description: Provision Mastercard to Google Pay on Android device
                value:
                  data:
                    walletId: '216'
                    eligibility:
                      enrollmentIndicator: NEW
                      sourceChannel: BCUS_Mobile
                    provision:
                      deviceName: Pixel 8 Pro
                      osName: ANDROID
                      osVersion: 14.0.0
              google-pay-visa:
                summary: Google Pay - VISA
                description: Provision VISA card to Google Pay (requires client wallet and device IDs)
                value:
                  data:
                    walletId: '216'
                    eligibility:
                      enrollmentIndicator: NEW
                      sourceChannel: BCUS_Mobile
                    provision:
                      deviceName: Samsung Galaxy S24
                      osName: ANDROID
                      osVersion: 14.0.0
                      clientWalletAccountId: walletaccount12345
                      clientDeviceId: device67890
              samsung-pay-mastercard:
                summary: Samsung Pay - Mastercard
                description: Provision Mastercard to Samsung Pay on Samsung device
                value:
                  data:
                    walletId: '217'
                    eligibility:
                      enrollmentIndicator: NEW
                      sourceChannel: SAMSUNG_Mobile
                    provision:
                      deviceName: Galaxy S24 Ultra
                      osName: ANDROID
                      osVersion: 14.0.0
              samsung-pay-visa:
                summary: Samsung Pay - VISA
                description: Provision VISA card to Samsung Pay (requires client wallet and device IDs)
                value:
                  data:
                    walletId: '217'
                    eligibility:
                      enrollmentIndicator: NEW
                      sourceChannel: SAMSUNG_Mobile
                    provision:
                      deviceName: Galaxy Z Fold 5
                      osName: ANDROID
                      osVersion: 13.0.0
                      clientWalletAccountId: '54321'
                      clientDeviceId: device09876
        required: true
      responses:
        '200':
          $ref: '#/components/responses/ExternalWalletProvisionRes'
        '400':
          $ref: '#/components/responses/BadRequest_WalletProvision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden_eligibility'
        '404':
          $ref: '#/components/responses/NotFound_WalletProvision'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '428':
          $ref: '#/components/responses/FraudChallenge'
      deprecated: false
