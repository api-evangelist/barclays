    OBWriteDomesticScheduledConsentResponse5:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        Data:
          type: object
          additionalProperties: false
          deprecated: false
          properties:
            ConsentId:
              type: string
              description: 'OB: Unique identification as assigned by the ASPSP to uniquely identify the consent resource.'
              example: BARCLAYS-P-12345678901234
              maxLength: 25
              minLength: 1
              pattern: ^BARCLAYS-P-\d{14}$
            CreationDateTime:
              type: string
              format: date-time
              description: "Date and time at which the resource was created. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            Status:
              $ref: '#/components/schemas/OBInternalConsentStatus2Code'
            StatusUpdateDateTime:
              type: string
              format: date-time
              description: "Date and time at which the consent resource status was updated. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            StatusReason:
              type: array
              items:
                $ref: '#/components/schemas/OBStatusReason'
              maxItems: 99999
              minItems: 0
            Permission:
              type: string
              description: Specifies the Open Banking service request types. For a full list of values see `OBInternalPermissions2Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
              enum:
              - Create
            ReadRefundAccount:
              type: string
              description: Specifies to share the refund account details with PISP. For a full list of values see `OBInternalReadRefundAccount1Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
              enum:
              - 'No'
              - 'Yes'
            CutOffDateTime:
              type: string
              format: date-time
              description: "Specified cut-off date and time for the payment consent. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            ExpectedExecutionDateTime:
              type: string
              format: date-time
              description: "Expected execution date and time for the payment resource. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            ExpectedSettlementDateTime:
              type: string
              format: date-time
              description: "Expected settlement date and time for the payment resource. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
            Charges:
              type: array
              items:
                type: object
                additionalProperties: false
                deprecated: false
                description: Set of elements used to provide details of a charge for the payment initiation.
                properties:
                  ChargeBearer:
                    $ref: '#/components/schemas/OBInternalChargeBearerType1Code'
                  Type:
                    $ref: '#/components/schemas/OBInternalPaymentChargeType1Code'
                  Amount:
                    $ref: '#/components/schemas/OBActiveOrHistoricCurrencyAndAmount'
                required:
                - Amount
                - ChargeBearer
                - Type
                nullable: false
              maxItems: 99999
              minItems: 0
            Initiation:
              type: object
              additionalProperties: false
              deprecated: false
              description: The Initiation payload is sent by the initiating party to the ASPSP. It is used to request movement of funds from the debtor account to a creditor for a single scheduled domestic payment.
              properties:
                InstructionIdentification:
                  type: string
                  description: 'Unique identification as assigned by an instructing party for an instructed party to unambiguously identify the instruction.

                    Usage: the  instruction identification is a point to point reference that can be used between the instructing party and the instructed party to refer to the individual instruction. It can be included in several messages related to the instruction.'
                  example: ANSM023
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9\-. '()£="_]{1,35})$
                EndToEndIdentification:
                  type: string
                  description: 'Unique identification assigned by the initiating party to unambiguously identify the transaction. This identification is passed on, unchanged, throughout the entire end-to-end chain.

                    Usage: The end-to-end identification can be used for reconciliation or to link tasks relating to the transaction. It can be included in several messages related to the transaction.

                    OB: The Faster Payments Scheme can only access 31 characters for the EndToEndIdentification field.'
                  example: FRESCO
                  maxLength: 35
                  minLength: 1
                  pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_]{1,35})$
                LocalInstrument:
                  $ref: '#/components/schemas/OBInternalLocalInstrument1Code'
                RequestedExecutionDateTime:
                  type: string
                  format: date-time
                  description: "Date at which the initiating party requests the clearing agent to process the payment. \nUsage: This is the date on which the debtor's account is to be debited. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
                InstructedAmount:
                  type: object
                  additionalProperties: false
                  deprecated: false
                  description: 'Amount of money to be moved between the debtor and creditor, before deduction of charges, expressed in the currency as ordered by the initiating party.

                    Usage: This amount has to be transported unchanged through the transaction chain.'
                  properties:
                    Amount:
                      $ref: '#/components/schemas/OBActiveCurrencyAndAmount_SimpleType'
                    Currency:
                      $ref: '#/components/schemas/ActiveOrHistoricCurrencyCode'
                  required:
                  - Amount
                  - Currency
                  nullable: false
                DebtorAccount:
                  type: object
                  additionalProperties: false
                  deprecated: false
                  description: Unambiguous identification of the account of the debtor to which a debit entry will be made as a result of the transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level, as displayed by the ASPSP''s online channels.

                        Note, the account name is not the product name or the nickname of the account.'
                      example: Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - SchemeName
                  nullable: false
                CreditorAccount:
                  type: object
                  additionalProperties: false
                  deprecated: false
                  description: Unambiguous identification of the account of the creditor to which a credit entry will be posted as a result of the payment transaction.
                  properties:
                    SchemeName:
                      $ref: '#/components/schemas/OBInternalAccountIdentification4Code'
                    Identification:
                      $ref: '#/components/schemas/Identification_0'
                    Name:
                      type: string
                      description: 'The account name is the name or names of the account owner(s) represented at an account level.

                        Note, the account name is not the product name or the nickname of the account.

                        OB: ASPSPs may carry out name validation for Confirmation of Payee, but it is not mandatory.'
                      example: Creditor Name
                      maxLength: 70
                      minLength: 1
                      pattern: ^(?!\s)([a-zA-Z0-9-. '()£="_,&@#\/;+]{1,70})$
                    SecondaryIdentification:
                      $ref: '#/components/schemas/SecondaryIdentification'
                    Proxy:
                      $ref: '#/components/schemas/OBProxy1'
                  required:
                  - Identification
                  - Name
                  - SchemeName
                  nullable: false
                CreditorPostalAddress:
                  $ref: '#/components/schemas/OBPostalAddress7'
                UltimateCreditor:
                  $ref: '#/components/schemas/OBUltimateCreditor1'
                UltimateDebtor:
                  $ref: '#/components/schemas/OBUltimateDebtor1'
                RegulatoryReporting:
                  type: array
                  items:
                    $ref: '#/components/schemas/OBRegulatoryReporting1'
                  maxItems: 3
                  minItems: 0
                RemittanceInformation:
                  $ref: '#/components/schemas/OBRemittanceInformation2'
                SupplementaryData:
                  $ref: '#/components/schemas/OBSupplementaryData1'
              required:
              - CreditorAccount
              - InstructedAmount
              - InstructionIdentification
              - RequestedExecutionDateTime
              nullable: false
            Authorisation:
              type: object
              additionalProperties: false
              deprecated: false
              description: The authorisation type request from the TPP.
              properties:
                AuthorisationType:
                  type: string
                  description: Type of authorisation flow requested. For a full list of values refer to `OBInternalAuthorisation1Code` in *OB_Internal_CodeSet* [here](https://github.com/OpenBankingUK/External_Internal_CodeSets)
                  enum:
                  - Any
                  - Single
                CompletionDateTime:
                  type: string
                  format: date-time
                  description: "Date and time at which the requested authorisation flow must be completed. All dates in the JSON payloads are represented in ISO 8601 date-time format. \nAll date-time fields in responses must include the timezone. An example is below:\n2017-04-05T10:43:07+00:00"
              required:
              - AuthorisationType
              nullable: false
            SCASupportData:
              $ref: '#/components/schemas/OBSCASupportData1'
            Debtor:
              $ref: '#/components/schemas/OBCashAccountDebtor4'
          required:
          - ConsentId
          - CreationDateTime
          - Initiation
          - Permission
          - Status
          - StatusUpdateDateTime
          nullable: false
        Risk:
          $ref: '#/components/schemas/OBRisk1'
        Links:
          $ref: '#/components/schemas/Links'
        Meta:
          $ref: '#/components/schemas/Meta'
      required:
      - Data
      - Risk
      nullable: false
