  /cards/accounts/external/{externalAccountID}/rewards/redemption:
    summary: Fulfill statement credit/ACH for the given account and corresponding program attributes.
    description: Deducts rewards from the given account and posts a statement credit/ACH. Returns a redemption id for tracking.
    post:
      tags:
      - Rewards-Redemption
      summary: Fulfill statement credit/ACH for the given account and corresponding program attributes.
      description: Deducts rewards from the given account and posts a statement credit/ACH. Returns a redemption id for tracking.
      operationId: postRewardsRedemption
      parameters:
      - name: Content-Type
        in: header
        description: Content-Type
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 16
          minLength: 16
          pattern: ^[a-z/]{16}$
        example: application/json
      - name: externalAccountID
        in: path
        description: A unique id (similar to UUID) created for each customer account.
        required: true
        deprecated: false
        schema:
          type: string
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        example: 0dbcb7ee-6c59-483b-966a-44d11557665b
      - name: Correlation-ID
        in: header
        description: 'Unique identifier for each incoming request. The API caller must pass this in the header, which will
          be cascaded through the API call stack.

          This is required to maintain compliance with the current Barclays REST standards.'
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 7d444840-9dc0-11d1-b245-5ffdce74fad2
      - name: X-Channel-Id
        in: header
        description: The channel ID of external entity initiating the call.
        required: false
        deprecated: false
        schema:
          type: string
          maxLength: 40
          minLength: 1
          pattern: ^[A-Za-z0-9\-_]{1,40}$
        example: WALLET
      - name: Authorization
        in: header
        description: TIAA-US External token
        required: true
        deprecated: false
        schema:
          type: string
        example: Bearer <token>
      requestBody:
        description: Contains information required for the redemption operation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedemptionRequestDataV3'
            examples:
              RedemptionRequestPayWithPoints:
                $ref: '#/components/examples/RedemptionRequestPayWithPoints'
              RedemptionRequestCashBackStmntCr:
                $ref: '#/components/examples/RedemptionRequestCashBackStmntCr'
              RedemptionRequestCashBackACH:
                $ref: '#/components/examples/RedemptionRequestCashBackACH'
        required: true
      responses:
        '200':
          $ref: '#/components/responses/RedemptionResponseV3'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/500_redemption'
        '403':
          $ref: '#/components/responses/Forbidden_redemption'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '428':
          $ref: '#/components/responses/FraudChallenge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
  /cards/accounts/external/{externalAccountID}/redemption/eligibility:
    summary: Rewards API for fetching redemption eligibility.
    description: Rewards API for fetching redemption eligibility.
    get:
      tags:
      - Rewards-Redemption-Eligibility
      summary: Retrieves redemption eligibility information based on available redemption options for a specific external
        account.
      description: Retrieves redemption eligibility information on available redemption options for a specific external account.
      operationId: getRedemptionEligibility
      parameters:
      - name: Correlation-ID
        in: header
        description: 'Unique identifier for each incoming request. The API caller must pass this in the header, which will
          be cascaded through the API call stack.

          This is required to maintain compliance with the current Barclays REST standards.'
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 7d444840-9dc0-11d1-b245-5ffdce74fad2
      - name: externalAccountID
        in: path
        description: A unique id (similar to UUID) created for each customer account.
        required: true
        deprecated: false
        schema:
          type: string
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        example: 0dbcb7ee-6c59-483b-966a-44d11557665b
      - name: includeCashBackACHEligibility
        in: query
        description: Include Cash Back ACH redemption eligibility information
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
        example: true
      - name: includeCashBackStmntCrEligibility
        in: query
        description: Include Cash Back Statement credit redemption eligibility information
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
        example: true
      - name: includePayWithPointsEligibility
        in: query
        description: Include Pay With Points redemption eligibility information
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
        example: true
      - name: Authorization
        in: header
        description: TIAA-US External token
        required: true
        deprecated: false
        schema:
          type: string
        example: Bearer <token>
      responses:
        '200':
          $ref: '#/components/responses/RedemptionEligibilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
  /cards/accounts/external/{externalAccountID}/redemption/history:
    summary: Get rewards redemption history for externalAccountId
    description: Get rewards redemption history for externalAccountId
    get:
      tags:
      - Rewards-Redemption-History
      summary: Get rewards redemption history for externalAccountId
      description: Get rewards redemption history for externalAccountId
      operationId: getRedemptionHistory
      parameters:
      - name: externalAccountID
        in: path
        description: A unique id (similar to UUID) created for each customer account.
        required: true
        deprecated: false
        schema:
          type: string
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        example: 0dbcb7ee-6c59-483b-966a-44d11557665b
      - name: Correlation-ID
        in: header
        description: 'Unique identifier for each incoming request. The API caller must pass this in the header, which will
          be cascaded through the API call stack.

          This is required to maintain compliance with the current Barclays REST standards.'
        required: true
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        example: 7d444840-9dc0-11d1-b245-5ffdce74fad2
      - name: redemptionType
        in: query
        description: List of redemption types which will be included in response
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: array
          items:
            type: string
            description: Type of redemption.
            example: CASH_BACK
            maxLength: 50
            minLength: 1
            pattern: ^[a-zA-Z_]{1,50}$
          maxItems: 50
          minItems: 1
        example:
        - CASH_BACK
        - PAY_WITH_POINTS
      - name: includeFailures
        in: query
        description: Include failed redemptions in response
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: true
        example: true
      - name: fromDate
        in: query
        description: Fetch redemption history starting from this date
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 10
          minLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
        example: '2024-02-21'
      - name: toDate
        in: query
        description: Fetch redemption history till this date
        required: false
        deprecated: false
        allowEmptyValue: false
        schema:
          type: string
          maxLength: 10
          minLength: 10
          pattern: ^\d{4}-\d{2}-\d{2}$
        example: '2026-02-21'
      - name: Authorization
        in: header
        description: TIAA-US External token
        required: true
        deprecated: false
        schema:
          type: string
        example: Bearer <token>
      responses:
        '200':
          $ref: '#/components/responses/RedemptionHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/500_redemption'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      deprecated: false
components:
  schemas:
    RedemptionRule:
      type: object
      additionalProperties: false
      deprecated: false
      description: Defined rule for the redemption type.
      properties:
        ruleId:
          type: string
          description: Unique identifier for the rule.
          example: '100005000000'
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]{1,50}$
        ruleName:
          type: string
          description: Name of the rule.
          example: Samsung Cashback Rule
          maxLength: 50
          minLength: 1
          pattern: ^.{1,50}$
        conversionRate:
          type: number
          description: Conversion rate for the redemption.
          example: 1
        minRedeem:
          type: number
          description: Minimum amount that can be redeemed.
          example: 1500
        maxRedeem:
          type: number
          description: Maximum amount that can be redeemed.
          example: 5000
      required:
      - conversionRate
      - maxRedeem
      - minRedeem
      - ruleId
      - ruleName
      nullable: false
    RedemptionResponseDataV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Root object that holds a redemption id and current rewards balance upon a successful redemption.
      properties:
        data:
          $ref: '#/components/schemas/RedemptionResponseV3'
      required:
      - data
      nullable: false
    Eligibility:
      type: object
      additionalProperties: false
      deprecated: false
      description: Determines eligibility of redemption option
      properties:
        value:
          type: boolean
          description: Redemption type eligibility determination and reasoning
          example: true
        ineligibilityReason:
          type: string
          description: Reason for ineligibility
          example: No configured accounts
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: true
      required:
      - value
      nullable: false
    RedemptionHistoryResponseData:
      type: object
      additionalProperties: false
      deprecated: false
      description: Redemption History Response Data
      properties:
        data:
          $ref: '#/components/schemas/RedemptionHistoryResponse'
      required:
      - data
      nullable: false
    FulfillmentMethod:
      type: object
      additionalProperties: false
      deprecated: false
      description: Fulfillment method for the redemption type.
      properties:
        fulfillmentMethod:
          type: string
          description: Method of fulfillment.
          example: STMNT_CR
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z_]{1,50}$
        capAmount:
          type: number
          description: Maximum amount that can be redeemed per cap period.
          example: 50
        capPeriod:
          type: string
          description: Period for the cap amount.
          example: DAY
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z_]{1,50}$
      required:
      - fulfillmentMethod
      nullable: false
    RewardBalanceV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains rewards balance.
      properties:
        availableBalance:
          type: number
          description: Current rewards balance for the given account. Represents the total amount of rewards that can be redeemed.
          example: 1000
        rewardCurrencyDisplayName:
          type: string
          description: User-friendly display name for the reward currency type. This is human-readable name to be shown in
            the user interface.
          example: Rewards
          maxLength: 50
          minLength: 1
          pattern: ^.{1,50}$
        rewardType:
          type: string
          description: Rewards currency type
          example: Cash
          maxLength: 16
          minLength: 1
          pattern: ^.{1,16}$
        isCashBased:
          type: boolean
          description: Indicates if rewards are cash based or non cash based.
          example: true
      required:
      - availableBalance
      - isCashBased
      - rewardCurrencyDisplayName
      - rewardType
      nullable: false
    CashCapability:
      type: object
      additionalProperties: false
      deprecated: false
      description: Details about the cash-based redemption capability.
      properties:
        redemptionType:
          type: string
          description: Type of redemption.
          example: CASH_BACK
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z_]{1,50}$
        redemptionTypeId:
          type: string
          description: Unique identifier for the redemption type.
          example: 6070de43-c712-4902-9077-0a69b691eaea
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        redemptionTypeName:
          type: string
          description: Name for the redemption type.
          example: Samsung Cashback
          maxLength: 100
          minLength: 1
          pattern: ^.{1,100}$
        fulfillmentMethods:
          type: array
          description: Available fulfillment methods for the redemption type.
          items:
            $ref: '#/components/schemas/FulfillmentMethod'
          maxItems: 5
          minItems: 1
        rules:
          type: array
          description: Defined rules for the redemption type.
          items:
            $ref: '#/components/schemas/RedemptionRule'
          maxItems: 20
          minItems: 1
      required:
      - fulfillmentMethods
      - redemptionType
      - redemptionTypeId
      - redemptionTypeName
      - rules
      nullable: false
    ACHDetails:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains details of external bank account to which ACH was applied
      properties:
        accountAlias:
          type: string
          description: User-defined account alias
          example: AAA Bank
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
        bankName:
          type: string
          description: Name of the bank
          example: Barclays
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
        last4Digits:
          type: number
          description: Last 4 digits of account number
          example: 1234
      nullable: true
    RedemptionResponseV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains redemption id and status of redemption request.
      properties:
        redemptionReferenceNumber:
          type: string
          description: UUID received in the API request will be sent back in the API response upon a successful redemption.
          example: 1c4717c4-d4a5-e3f3-4a71-b868908763ff
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        redemptionId:
          type: string
          description: Unique id generated by Barclays for a redemption.
          example: '142342342'
          maxLength: 20
          minLength: 1
          pattern: ^[a-zA-Z0-9]{1,20}$
        status:
          type: string
          description: Redemption status
          enum:
          - ACCEPTED
          - IN_PROCESS
          - COMPLETED
          - FAILURE
          - CANCELLED
          - RETURNED
          example: COMPLETED
      required:
      - redemptionId
      - redemptionReferenceNumber
      - status
      nullable: false
    RedemptionCapabilitiesResponseData:
      type: object
      additionalProperties: false
      deprecated: false
      description: Redemption Capabilities Response Data
      properties:
        data:
          $ref: '#/components/schemas/RedemptionCapabilitiesResponse'
      required:
      - data
      nullable: false
    RedemptionAmount:
      type: object
      additionalProperties: false
      deprecated: false
      description: Dollar value of rewards to be applied to the account via statement credit or ACH
      properties:
        currency:
          type: string
          description: Currency
          example: USD
          maxLength: 10
          minLength: 1
          pattern: ^.{1,10}$
        amount:
          type: number
          description: Amount
          example: 20
      nullable: true
    ErrorType:
      type: object
      additionalProperties: false
      description: Message details - additional operation execution information.
      properties:
        id:
          type: string
          description: Generated message identifier for particular request, helping to locate server logs.
          example: 1c4717c4-d4a5-e3f3-4a71-b868908763ff
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        code:
          type: string
          description: Machine readable, unique code of the message related to particular case within operation execution.
          example: ACCOUNT_NUMBER_NOT_FOUND
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_]{1,100}$
        title:
          type: string
          description: Short description of the error. Not for displaying purposes.
          example: The authorization credentials required for this request are invalid
          maxLength: 250
          minLength: 1
          pattern: ^[a-zA-Z0-9\s"=,']{1,250}$
        detail:
          type: string
          description: Provides additional low-level details about the error to assist with troubleshooting. Not for displaying
            purposes.
          maxLength: 250
          minLength: 1
          pattern: ^[a-zA-Z0-9\s"=,']{1,250}$
      required:
      - code
      - id
      - title
    RedemptionRequestDataV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Root object that holds redemption amount and related program attributes.
      properties:
        data:
          $ref: '#/components/schemas/RedemptionRequestV3'
      required:
      - data
      nullable: false
    TransactionInfo:
      type: object
      additionalProperties: false
      description: Optional metadata supplied by partner for pay with points redemption.
      properties:
        authorizationCode:
          type: string
          description: Authorization code generated by merchant at point of sale.
          example: 5R20BK11W6
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z0-9]{1,50}$
        transactionDesc:
          type: string
          description: Free-text description of the source transaction tied to redemption.
          example: Online order placed at Expedia.com for a hotel booking
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: true
      nullable: true
    RedemptionEligibilityResponseData:
      type: object
      additionalProperties: false
      deprecated: false
      description: Redemption Eligibility Response Data
      properties:
        data:
          $ref: '#/components/schemas/RedemptionEligibilityResponse'
      required:
      - data
      nullable: false
    RedemptionRequestV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Redemption amount and related program attributes.
      properties:
        redemptionReferenceNumber:
          type: string
          description: UUID to keep track of each redemption request from a partner. Generated by the partner and passed in
            each request.
          example: 1c4717c4-d4a5-e3f3-4a71-b868908763ff
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        redemptionAmount:
          type: number
          description: Dollar value of the rewards to be redeemed. Minimum and Maximum limits depend on program setup.
          example: 50
        conversionRate:
          type: number
          description: 'Denotes the dollar value of rewards (ex: 1 point = $0.01).'
          example: 0.01
        rewards:
          type: number
          description: Quantity of rewards/points consumed for this redemption.
          example: 50
        redemptionTypeId:
          type: string
          description: Unique identifier for the partner product brand.
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        redemptionType:
          type: string
          description: Type of redemption.
          example: CASH_BACK
          maxLength: 30
          minLength: 1
          pattern: ^[a-zA-Z_]{1,30}$
        fulfillmentMethod:
          type: string
          description: Method of fulfillment.
          example: STMNT_CR
          maxLength: 20
          minLength: 1
          pattern: ^[a-zA-Z_]{1,20}$
        externalAccountRefId:
          type: string
          description: External account reference ID required for ACH-based fulfillment.
          example: '1214534'
          maxLength: 30
          minLength: 1
          pattern: ^[0-9a-zA-Z]{1,30}$
          nullable: true
        transactionInfo:
          $ref: '#/components/schemas/TransactionInfo'
      required:
      - conversionRate
      - fulfillmentMethod
      - redemptionAmount
      - redemptionReferenceNumber
      - redemptionType
      - redemptionTypeId
      - rewards
      nullable: false
    CashBackACH:
      type: object
      additionalProperties: false
      deprecated: false
      description: Cash Back ACH redemption eligibility information (only present if query parameter includeCashBackACHEligibility=true)
      properties:
        eligibility:
          $ref: '#/components/schemas/Eligibility'
        remainingLimit:
          $ref: '#/components/schemas/RemainingLimit'
        externalAccounts:
          type: array
          description: List of external bank accounts configured for ACH
          items:
            $ref: '#/components/schemas/ExternalAccount'
          maxItems: 100
          minItems: 0
      required:
      - eligibility
      - externalAccounts
      nullable: true
    CashBackStmntCr:
      type: object
      additionalProperties: false
      deprecated: false
      description: Cash Back Statement credit redemption eligibility information (only present if query parameter includeCashBackStmntCrEligibility=true)
      properties:
        eligibility:
          $ref: '#/components/schemas/Eligibility'
        remainingLimit:
          $ref: '#/components/schemas/RemainingLimit'
      required:
      - eligibility
      nullable: true
    LineItem:
      type: object
      additionalProperties: false
      deprecated: false
      properties:
        lineItemId:
          type: string
          description: line item id
          example: S16705z
          maxLength: 36
          minLength: 1
          pattern: ^[a-zA-Z0-9-]{1,36}$
        rewardName:
          type: string
          description: Reward name
          example: Points Payback Credit
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
        rewardsRedeemed:
          type: number
          description: Rewards redeemed
          example: 11
        fulfillmentMethod:
          type: string
          description: Method of fulfillment or delivery
          example: RW_ACH
          maxLength: 20
          minLength: 1
          pattern: ^.{1,20}$
        shippingDate:
          type: string
          description: Delivery date of Non-Cash gift card/merchandise
          example: 07/25/2025
          maxLength: 10
          minLength: 10
          pattern: ^\d{2}/\d{2}/\d{4}$
          nullable: true
        redemptionAmount:
          $ref: '#/components/schemas/RedemptionAmount'
        replenishedRewards:
          type: number
          description: Rewards replenished during redemption
          example: 11
        quantity:
          type: number
          description: Redeemed quantity of a line item
          example: 10
        redemptionStatus:
          type: string
          description: Redemption status
          enum:
          - ACCEPTED
          - IN_PROCESS
          - COMPLETED
          - FAILURE
          - CANCELLED
          - RETURNED
          example: COMPLETED
        redemptionStatusDetail:
          type: string
          description: Redemption status detail populated if includeFailures is true for failed redemptions
          example: T&C not met
          maxLength: 400
          minLength: 1
          pattern: ^.{1,400}$
          nullable: true
        purchaseDetails:
          $ref: '#/components/schemas/TransactionInfo'
        achDetails:
          $ref: '#/components/schemas/ACHDetails'
      required:
      - fulfillmentMethod
      - lineItemId
      - quantity
      - redemptionStatus
      - rewardName
      - rewardsRedeemed
      nullable: false
    ErrorResponseType:
      type: object
      additionalProperties: false
      deprecated: false
      description: 'An API error response.

        '
      properties:
        meta:
          type: object
          additionalProperties: true
          description: Contains Non-standard meta information
        errors:
          type: array
          description: 'Contains one or more error messages and is mutually exclusive with the data item.

            This will not be returned in success scenarios.

            '
          items:
            $ref: '#/components/schemas/ErrorType'
          maxItems: 50
          minItems: 0
      nullable: false
    ExternalAccount:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains details of external bank accounts configured on an account for ACH
      properties:
        id:
          type: string
          description: External account identifier
          example: 12311da
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
        accountAlias:
          type: string
          description: User-defined account alias
          example: AAA Bank
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
        bankName:
          type: string
          description: Name of the bank
          example: Barclays
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
        last4Digits:
          type: number
          description: Last 4 digits of account number
          example: 1234
        accountType:
          type: string
          description: Type of bank account
          example: CHECKING
          maxLength: 200
          minLength: 1
          pattern: ^.{1,200}$
          nullable: false
      required:
      - accountAlias
      - accountType
      - bankName
      - id
      - last4Digits
      nullable: false
    RedemptionEligibilityResponse:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains redemption eligibility information based on available redemption options for a specific external
        account.
      properties:
        isAccountStatusValid:
          type: boolean
          description: True if account is eligible to redeem the current rewards balance, determined based on if the account
            is in good standing with regards to account statuses.
          example: true
        cashBackACH:
          $ref: '#/components/schemas/CashBackACH'
        cashBackStmntCr:
          $ref: '#/components/schemas/CashBackStmntCr'
        payWithPoints:
          $ref: '#/components/schemas/PayWithPoints'
      required:
      - isAccountStatusValid
      nullable: false
    PayWithPoints:
      type: object
      additionalProperties: false
      deprecated: false
      description: Pay With Points redemption eligibility information (only present if query parameter includePayWithPointsEligibility=true)
      properties:
        eligibility:
          $ref: '#/components/schemas/Eligibility'
        remainingLimit:
          $ref: '#/components/schemas/RemainingLimit'
      required:
      - eligibility
      nullable: true
    RedemptionCapabilitiesResponse:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains redemption eligibility information based on available redemption options for a specific external
        account.
      properties:
        partnerProductBrandId:
          type: string
          description: Unique identifier for the partner product brand.
          example: 4f9d630a-249b-474f-9efa-6a03b4dd407c
          maxLength: 36
          minLength: 36
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
        partnerProductBrandName:
          type: string
          description: Name of the partner product brand.
          example: SMG001
          maxLength: 6
          minLength: 6
          pattern: ^[a-zA-Z0-9]{6}$
        rewardType:
          type: string
          description: Rewards currency type
          example: POINTS
          maxLength: 10
          minLength: 1
          pattern: ^[a-zA-Z]{1,10}$
        rewardCurrencyDisplayName:
          type: string
          description: Display name of the reward type.
          example: Rewards
          maxLength: 50
          minLength: 1
          pattern: ^.{1,50}$
        isCashBased:
          type: boolean
          description: Indicates if the reward type is cash-based.
          example: true
        cashCapabilities:
          type: array
          description: List of cash-based redemption capabilities.
          items:
            $ref: '#/components/schemas/CashCapability'
          maxItems: 10
          minItems: 1
        nonCashCapabilities:
          type: array
          description: List of non-cash redemption capabilities.
          items:
            type: object
            additionalProperties: true
          maxItems: 10
          minItems: 1
          nullable: true
      required:
      - cashCapabilities
      - isCashBased
      - partnerProductBrandId
      - partnerProductBrandName
      - rewardCurrencyDisplayName
      - rewardType
      nullable: false
    RewardBalanceDataV3:
      type: object
      additionalProperties: false
      deprecated: false
      description: Root object that holds rewards balance.
      properties:
        data:
          $ref: '#/components/schemas/RewardBalanceV3'
      required:
      - data
      nullable: false
    Redemption:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains redemption history information.
      properties:
        redemptionType:
          type: string
          description: Type of redemption.
          example: CASH_BACK
          maxLength: 30
          minLength: 1
          pattern: ^[a-zA-Z_]{1,30}$
        redemptionId:
          type: string
          description: Unique id generated by Barclays for a redemption
          example: 1c4717c4-d4a5-e3f3-4a71-b868908763ff
          maxLength: 36
          minLength: 1
          pattern: ^[0-9a-zA-Z-]{1,36}$
        redemptionTimestamp:
          type: string
          description: Redemption timestamp in EST
          example: 06/28/2024 03:19:05
          maxLength: 19
          minLength: 19
          pattern: ^\d{2}/\d{2}/\d{4} \d{2}:\d{2}:\d{2}$
        lineItems:
          type: array
          description: List of line items redeemed for a redemption type
          items:
            $ref: '#/components/schemas/LineItem'
          maxItems: 50
          minItems: 1
      required:
      - lineItems
      - redemptionId
      - redemptionTimestamp
      - redemptionType
      nullable: false
    RemainingLimit:
      type: object
      additionalProperties: false
      deprecated: false
      description: Contains the remaining amount for redemption if a cap amount is configured on redemption option
      properties:
        value:
          type: number
          description: Monetary amount currently available for redemption requests
          example: 100
        currency:
          type: string
          description: Currency code indicating the monetary denomination
          example: USD
          maxLength: 4
          minLength: 1
          pattern: ^[a-zA-Z]{1,4}$
      required:
      - currency
      - value
      nullable: true
    RedemptionHistoryResponse:
      type: object
      additionalProperties: false
      deprecated: false
      description: Redemption history Response
      properties:
        redemptionHistory:
          type: array
          description: List of rewards redeemed
          items:
            $ref: '#/components/schemas/Redemption'
          maxItems: 200
          minItems: 0
      required:
      - redemptionHistory
      nullable: false
  responses:
    RewardPointBalanceResponseV3:
