        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseType'
          examples:
            Forbidden:
              $ref: '#/components/examples/example-error-403'
    RedemptionEligibilityResponse:
      description: Redemption Eligibility Response Data
