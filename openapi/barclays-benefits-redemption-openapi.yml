              $ref: '#/components/examples/ResponseWithAllRedemptionCapabilities'
            ResponseWithOnlyCashRedemptionCapabilities:
              $ref: '#/components/examples/ResponseWithOnlyCashRedemptionCapabilities'
    TooManyRequests:
      description: 'Server received a large number of requests from a single party in a given amount of time. Client is advised
