              $ref: '#/components/examples/ResponseNonCashRedemption'
            Response_CASH_Redemption_IncludeFailures_True:
              $ref: '#/components/examples/ResponseWhenIncludeFailures_true'
  parameters:
    Correlation-ID:
      name: Correlation-ID
      in: header
      description: 'Unique identifier for each incoming request. The API caller must pass this in the header, which will be
        cascaded through the API call stack.

        This is required to maintain compliance with the current Barclays REST standards.

        '
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 36
        minLength: 36
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      example: 7d444840-9dc0-11d1-b245-5ffdce74fad2
    RedemptionType:
      name: redemptionType
      in: query
      description: List of redemption types which will be included in response
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: array
        items:
          type: string
          description: Type of redemption.
          example: CASH_BACK
          maxLength: 50
          minLength: 1
          pattern: ^[a-zA-Z_]{1,50}$
        maxItems: 50
        minItems: 1
      example:
      - CASH_BACK
      - PAY_WITH_POINTS
    IncludeFailures:
      name: includeFailures
      in: query
      description: Include failed redemptions in response
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: boolean
        default: true
      example: true
    X-Channel-Id:
      name: X-Channel-Id
      in: header
      description: 'The channel ID of external entity initiating the call.

        '
      required: false
      deprecated: false
      schema:
        type: string
        maxLength: 40
        minLength: 1
        pattern: ^[A-Za-z0-9\-_]{1,40}$
      example: WALLET
    IncludeCashBackStmntCrEligibility:
      name: includeCashBackStmntCrEligibility
      in: query
      description: Include Cash Back Statement credit redemption eligibility information
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: boolean
        default: true
      example: true
    X-IDVSessionID:
      name: X-IDVSessionID
      in: header
      description: X-IDVSessionID will be populated by Akana if the grant-type is Auth-Grant. This token will be used by Fraud
        domain to access fraud context and provide decisioning.
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 36
        minLength: 36
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 8f4c2ae3-d998-4c44-8cc8-851ce18a344a
    oauth_clientId:
      name: oauth_clientId
      in: header
      description: 'OAuth Client ID used for partner entitlement check.

        '
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 256
        minLength: 1
        pattern: ^[a-zA-Z0-9.-]{1,256}$
      example: bdn-68EwxNCdDi65Y2FV6wxupfsoD3ilveYxDqok0LD5
    Authorization:
      name: Authorization
      in: header
      description: 'Bearer Token

        '
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 2048
        minLength: 32
        pattern: ^[A-Za-z0-9\-_\.\ ]{32,2048}$
      example: Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Imctb09kUnc1TWFlTmcwbWpsN1VpczlXT010NCIsInBpLmF0bSI6IjQ2N3YifQ..Jkgb2A2HAOdLKaion8ff097GedtQkxtAV4Qxea538owLS8zaEvTm9kHBWOxmuNHIgP1V8mx3NUflwbY8A823Ut00wWqbUbB-cSV0idDaQJ2pKWHDFYbipvi5I7yPGj2BR-oHhQao1ZGlW6DyxYuZ12q8IK7LpKVWbCSPZ-fFAlD5HgH_FORq6Avc5oLH--Zcww63fI6gtZ48pwnXX2gM1aiSQ3lfvLXWVQ9fooAlP65LOW1MMjh5HOtrNvA7ObBSYepYzef5ykP2YvIz3OOS4hLhTo-3-iEbUDvkPx_mmz_pi7piXrMqQPfPnz5y2VkLOHTYfQJeQmVg60YTG7uPdw
    IncludeCashBackACHEligibility:
      name: includeCashBackACHEligibility
      in: query
      description: Include Cash Back ACH redemption eligibility information
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: boolean
        default: true
      example: true
    X-Party-ID:
      name: X-Party-ID
      in: header
      description: X-Party-ID will be populated by Akana if the grant-type is Auth-Grant.
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 12
        minLength: 1
        pattern: ^[0-9]{1,12}$
      example: '43545647'
    ExternalAccountIdPath:
      name: externalAccountID
      in: path
      description: A unique id (similar to UUID) created for each customer account.
      required: true
      deprecated: false
      schema:
        type: string
        maxLength: 36
        minLength: 1
        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 0dbcb7ee-6c59-483b-966a-44d11557665b
    IncludePayWithPointsEligibility:
      name: includePayWithPointsEligibility
      in: query
      description: Include Pay With Points redemption eligibility information
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: boolean
        default: true
      example: true
    X-Auth-Type:
      name: X-Auth-Type
      in: header
      description: X-Auth-Type will be populated by Akana to identify grant-type
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 50
        minLength: 1
        pattern: ^[a-zA-Z0-9.-_]{1,50}$
      example: '43545647'
    FromDate:
      name: fromDate
      in: query
      description: Fetch redemption history starting from this date
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 10
        minLength: 10
        pattern: ^\d{4}-\d{2}-\d{2}$
      example: '2024-02-21'
    ToDate:
      name: toDate
      in: query
      description: Fetch redemption history till this date
      required: false
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 10
        minLength: 10
        pattern: ^\d{4}-\d{2}-\d{2}$
      example: '2026-02-21'
    Content-Type:
      name: Content-Type
      in: header
      description: Content-Type
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
        maxLength: 16
        minLength: 16
        pattern: ^[a-z/]{16}$
      example: application/json
