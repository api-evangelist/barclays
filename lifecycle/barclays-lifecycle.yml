versioning:
  scheme: major.minor per API, carried in the API Exchange version record and in OpenAPI info.version
  in_url: true
  note: UK Open Banking APIs track the OBIE Read/Write version (v3.1, v4.0) and both versions are published side
    by side on the portal; the Barclaycard US APIs use plain 1.0/2.0/3.0/4.0. The version segment appears in the
    request path (e.g. /open-banking/v3.1/event-subscriptions).
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  deprecated_operations: 0
  note: 'No deprecation or sunset policy is published on developer.barclays.com, and no operation or schema in the
    26 harvested specs carries deprecated: true with a replacement. Superseded versions are left listed alongside
    the current one rather than marked deprecated — Confirmation of Funds, Payment Initiation, Account and Transactions
    and Event Notification each publish both v3.1 and v4.0 with no machine-readable signal of which is retiring.
    The Consent API that this record listed previously now returns HTTP 401 from the registry and is no longer in
    the public catalogue.'
